# ─────────────────────────────────────────────────────────
# AI Recruiter — Promptfoo Evaluation Config
# ADR: ADR-013 (Lightweight Prompt Evaluation & CI/CD Pipeline)
# Tasks: P10-2 (config), P10-4 (JS assertions)
#
# Usage:
#   cd scraper && npm run eval         # run full evaluation
#   cd scraper && npm run eval:view    # open HTML report in browser
#
# Prerequisites:
#   - Ollama running locally with llama3.1:latest pulled
#   - npm install in /scraper (promptfoo is a devDependency)
# ─────────────────────────────────────────────────────────

description: "AI Recruiter — Evaluator Prompt v1"

# ─── Prompt ──────────────────────────────────────────────
# Chat-format template: system prompt (from evaluator.md) + user message
# Variables: {{title}}, {{company}}, {{location}}, {{salary}}, {{url}}, {{body}}
prompts:
  - file://evaluator-template.json

# ─── Providers ───────────────────────────────────────────
providers:
  - id: ollama:chat:llama3.1:latest
    label: "Llama 3.1 8B (local Ollama)"
    config:
      temperature: 0
      format: "json"

# ─── Optional: Grading provider for llm-rubric assertions ──
# Uncomment and set GOOGLE_API_KEY env var to enable
# reasoning quality checks via Gemini Flash (free tier).
#
# defaultTest:
#   options:
#     provider:
#       id: google:gemini-1.5-flash
#       config:
#         temperature: 0

# ─── Default Assertions (P10-4) ─────────────────────────
# Applied to EVERY test case automatically.
# Zero-cost JavaScript checks — no API calls, instant execution.
defaultTest:
  vars:
    profile: file://candidate_profile.md
  assert:
    # 1. Output must contain a valid JSON object
    - type: javascript
      value: |
        const start = output.indexOf('{');
        const end = output.lastIndexOf('}');
        if (start === -1 || end === -1 || end < start) return false;
        const cleaned = output.substring(start, end + 1).trim();
        try {
          JSON.parse(cleaned);
          return true;
        } catch(e) {
          return false;
        }
      weight: 2

    # 2. JSON must contain overall_score, tech_stack_match, seniority_match, red_flags, reason, url
    - type: javascript
      value: |
        const start = output.indexOf('{');
        const end = output.lastIndexOf('}');
        if (start === -1 || end === -1 || end < start) return false;
        const cleaned = output.substring(start, end + 1).trim();
        const parsed = JSON.parse(cleaned);
        const hasOverall = typeof parsed.overall_score === 'number' && parsed.overall_score >= 0 && parsed.overall_score <= 100;
        const hasTech = typeof parsed.tech_stack_match === 'number' && parsed.tech_stack_match >= 0 && parsed.tech_stack_match <= 100;
        const hasSeniority = typeof parsed.seniority_match === 'number' && parsed.seniority_match >= 0 && parsed.seniority_match <= 100;
        const hasRedFlags = Array.isArray(parsed.red_flags) && parsed.red_flags.every(x => typeof x === 'string');
        const hasReason = typeof parsed.reason === 'string' && parsed.reason.length > 0;
        const hasUrl = typeof parsed.url === 'string' && parsed.url.length > 0;
        return hasOverall && hasTech && hasSeniority && hasRedFlags && hasReason && hasUrl;
      weight: 2

    # 3. URL in LLM response must echo back the input URL
    - type: javascript
      value: |
        const start = output.indexOf('{');
        const end = output.lastIndexOf('}');
        if (start === -1 || end === -1 || end < start) return false;
        const cleaned = output.substring(start, end + 1).trim();
        const parsed = JSON.parse(cleaned);
        return parsed.url === context.vars.url;
      weight: 1

    # 4. Red flags formatting validation (no commas, no markdown, length limit)
    - type: javascript
      value: |
        const start = output.indexOf('{');
        const end = output.lastIndexOf('}');
        if (start === -1 || end === -1 || end < start) return false;
        const cleaned = output.substring(start, end + 1).trim();
        const parsed = JSON.parse(cleaned);
        if (!Array.isArray(parsed.red_flags)) return false;
        for (const flag of parsed.red_flags) {
          if (typeof flag !== 'string') return false;
          if (flag.includes(',')) return false;
          if (flag.includes('*') || flag.includes('_') || flag.includes('`') || flag.includes('\n') || flag.includes('\r')) return false;
          const wordCount = flag.trim().split(/\s+/).length;
          if (wordCount < 1 || wordCount > 6) return false;
        }
        return true;
      weight: 2

# ─── Test Cases ──────────────────────────────────────────
# Gold dataset: 20 curated test cases (8 true, 7 false, 5 edge cases)
# Source: evaluator.md criteria + real-world patterns from dry-runs
tests: file://gold_dataset.yaml
