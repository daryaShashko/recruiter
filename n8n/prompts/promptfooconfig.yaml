# ─────────────────────────────────────────────────────────
# AI Recruiter — Promptfoo Evaluation Config
# ADR: ADR-013 (Lightweight Prompt Evaluation & CI/CD Pipeline)
# Tasks: P10-2 (config), P10-4 (JS assertions)
#
# Usage:
#   cd scraper && npm run eval         # run full evaluation
#   cd scraper && npm run eval:view    # open HTML report in browser
#
# Prerequisites:
#   - Ollama running locally with llama3.1:latest pulled
#   - npm install in /scraper (promptfoo is a devDependency)
#   - GOOGLE_API_KEY env var set (free tier: aistudio.google.com) — for llm-rubric grading only
#   - Note: llm-rubric assertions fail without GOOGLE_API_KEY
# ─────────────────────────────────────────────────────────

description: "AI Recruiter — Evaluator Prompt v1"

# ─── Prompt ──────────────────────────────────────────────
# Chat-format template: system prompt + user message + assistant prefill "{"
# Variables: {{title}}, {{company}}, {{location}}, {{salary}}, {{url}}, {{body}}
prompts:
  - file://evaluator-template.json

# ─── Providers ───────────────────────────────────────────
# Provider is selected via LLM_PROVIDER env var (required, no default).
# Example: LLM_PROVIDER=ollama:chat:llama3.1:latest npm run eval
providers:
  - id: "{{env.LLM_PROVIDER}}"
    label: "{{env.LLM_PROVIDER}}"
    config:
      temperature: 0
      # Ollama only — other providers ignore this field and use their own structured-output mechanisms.
      # Enforces clean JSON output without markdown fences via Ollama's native `format` parameter.
      # Schema matches EvaluationResult interface (n8n/providers/_interface.ts).
      format:
        type: object
        required:
          [
            overall_score,
            tech_stack_match,
            seniority_match,
            red_flags,
            reason,
            url,
          ]
        properties:
          overall_score: { type: number, minimum: 0, maximum: 100 }
          tech_stack_match: { type: number, minimum: 0, maximum: 100 }
          seniority_match: { type: number, minimum: 0, maximum: 100 }
          red_flags: { type: array, items: { type: string } }
          reason: { type: string }
          url: { type: string }

# ─── Default Assertions (P10-4, P10-5) ────────────────────
# Applied to EVERY test case automatically.
# JS checks are zero-cost; llm-rubric requires GOOGLE_API_KEY.
#
# Parser helper used in every assertion:
#   p(output) — handles two cases:
#     1. Full JSON:    output = '{"key": val}'   → extract from { to last }
#     2. Prefill cont: output = '"key": val, ...}' → prepend { (Ollama omits the prefilled '{')
defaultTest:
  vars:
    profile: file://candidate_profile.md
  options:
    provider:
      id: google:gemini-3.1-flash-lite
      config:
        temperature: 0
  assert:
    # 1. Output must parse as a valid JSON object
    - type: javascript
      value: |
        function p(o) {
          const end = o.lastIndexOf('}');
          if (end === -1) return null;
          const s = o.indexOf('{');
          try { return JSON.parse(s !== -1 ? o.substring(s, end+1) : '{' + o.substring(0, end+1)); }
          catch(e) { return null; }
        }
        return p(output) !== null;
      weight: 2

    # 2. JSON must contain all required fields with correct types
    - type: javascript
      value: |
        function p(o) {
          const end = o.lastIndexOf('}');
          if (end === -1) return null;
          const s = o.indexOf('{');
          try { return JSON.parse(s !== -1 ? o.substring(s, end+1) : '{' + o.substring(0, end+1)); }
          catch(e) { return null; }
        }
        const j = p(output);
        if (!j) return false;
        return typeof j.overall_score === 'number' && j.overall_score >= 0 && j.overall_score <= 100
          && typeof j.tech_stack_match === 'number' && j.tech_stack_match >= 0 && j.tech_stack_match <= 100
          && typeof j.seniority_match === 'number' && j.seniority_match >= 0 && j.seniority_match <= 100
          && Array.isArray(j.red_flags) && j.red_flags.every(x => typeof x === 'string')
          && typeof j.reason === 'string' && j.reason.length > 0
          && typeof j.url === 'string' && j.url.length > 0;
      weight: 2

    # 3. URL in response must echo back the input URL
    - type: javascript
      value: |
        function p(o) {
          const end = o.lastIndexOf('}');
          if (end === -1) return null;
          const s = o.indexOf('{');
          try { return JSON.parse(s !== -1 ? o.substring(s, end+1) : '{' + o.substring(0, end+1)); }
          catch(e) { return null; }
        }
        const j = p(output);
        return j !== null && j.url === context.vars.url;
      weight: 1

    # 4. red_flags: flat string array, no commas/markdown, 1-6 words per item
    - type: javascript
      value: |
        function p(o) {
          const end = o.lastIndexOf('}');
          if (end === -1) return null;
          const s = o.indexOf('{');
          try { return JSON.parse(s !== -1 ? o.substring(s, end+1) : '{' + o.substring(0, end+1)); }
          catch(e) { return null; }
        }
        const j = p(output);
        if (!j || !Array.isArray(j.red_flags)) return false;
        for (const flag of j.red_flags) {
          if (typeof flag !== 'string') return false;
          if (flag.includes(',')) return false;
          if (/[*_`\n\r]/.test(flag)) return false;
          const words = flag.trim().split(/\s+/).length;
          if (words < 1 || words > 6) return false;
        }
        return true;
      weight: 2

    # 5. LLM-rubric: quality of the "reason" field only (P10-5)
    #    Ignores format issues (markdown, preamble) — those are JS assertions' job.
    #    Requires GOOGLE_API_KEY.
    - type: llm-rubric
      value: >-
        Extract the "reason" field from the JSON in the output (ignore any surrounding
        text or markdown fences). Evaluate ONLY that reason string.
        The reason MUST: (1) be written in English, (2) be one concise sentence,
        (3) reference at least one specific concrete detail — either a technology name
        (e.g. "Java", "Angular"), a location (e.g. "Warsaw on-site"),
        a seniority level (e.g. "junior", "entry-level", "no experience required"),
        a salary level (e.g. "below 18k", "financial mismatch"),
        an industry (e.g. "blockchain/crypto"),
        OR clearly state the vacancy is invalid/spam/not a job posting.
        PASS if the reason is specific and informative, or correctly identifies spam.
        FAIL if the reason is purely generic (e.g. "does not match the profile")
        with no concrete detail whatsoever.
      weight: 1

# ─── Evaluate Options ───────────────────────────────────
# maxConcurrency:1 — sequential execution, natural rate limiter for Gemini grading.
# Ollama takes ~12s/test → ~5 Gemini grading calls/min, safely under 15 RPM limit.
evaluateOptions:
  maxConcurrency: 1

# ─── Test Cases ──────────────────────────────────────────
# Gold dataset: 22 curated test cases (8 true, 9 false, 5 edge cases)
# Source: evaluator.md criteria + real-world patterns from dry-runs
tests: file://gold_dataset.yaml
