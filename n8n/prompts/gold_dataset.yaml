- description: "T01: Senior Node.js Backend Developer — Remote (classic match)"
  vars:
    title: "Senior Node.js Backend Developer"
    company: "TechFlow Solutions"
    location: "Remote (EU)"
    salary: "22,000 – 28,000 PLN net B2B"
    url: "https://justjoin.it/offers/techflow-senior-nodejs-backend-dev-12345"
    body: >-
      We are hiring a Senior Node.js Backend Developer to join our remote-first
      engineering team. You will design and build RESTful APIs using TypeScript,
      Express.js, and PostgreSQL. Experience with Docker, CI/CD, and cloud
      services (AWS/GCP) is required. Our frontend is built with React.
      Minimum 5 years of professional experience in backend development
      with Node.js. Fully remote position within EU timezone.
  assert:
    - type: javascript
      value: "JSON.parse(output).match === true"
      weight: 3
    # Uncomment when GOOGLE_API_KEY is set:
    # - type: llm-rubric
    #   value: "Reasoning must mention Node.js/TypeScript as the primary stack and confirm remote eligibility."
    #   provider: google:gemini-1.5-flash

