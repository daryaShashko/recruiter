- description: "E01: Node.js + Java legacy — Node.js is PRIMARY → should match"
  vars:
    title: "Senior Software Engineer"
    company: "LegacyTech"
    location: "Remote"
    salary: "22,000 – 28,000 PLN net B2B"
    url: "https://justjoin.it/offers/legacytech-senior-engineer-nodejs-java-aaaa1"
    body: >-
      We are rebuilding our platform in Node.js and TypeScript. Primary
      development is Node.js microservices with NestJS framework, React
      frontend with Next.js, and PostgreSQL database. Some legacy Java
      services exist but are actively being migrated to Node.js. You will
      spend 80% of your time on Node.js and 20% maintaining Java services
      during the transition. 5+ years experience, Node.js expertise required.
  assert:
    - type: javascript
      value: "JSON.parse(output).match === true"
      weight: 3
    # Uncomment when GOOGLE_API_KEY is set:
    # - type: llm-rubric
    #   value: "Reasoning must acknowledge Node.js as the primary stack despite Java legacy presence."
    #   provider: google:gemini-1.5-flash

- description: "E02: Java primary + Node.js secondary — Java is PRIMARY → should NOT match"
  vars:
    title: "Senior Software Engineer (Java/Node.js)"
    company: "HybridTech"
    location: "Remote"
    salary: "24,000 – 30,000 PLN net B2B"
    url: "https://justjoin.it/offers/hybridtech-senior-java-nodejs-bbbb2"
    body: >-
      Our main platform is built on Java Spring Boot with Kafka event
      streaming and PostgreSQL. We recently added a small Node.js BFF
      (Backend-for-Frontend) layer for our React admin dashboard. Your
      primary responsibilities will be Java microservices development (70%),
      with occasional Node.js BFF work (30%). Java expertise is required;
      Node.js is a nice-to-have.
  assert:
    - type: javascript
      value: "JSON.parse(output).match === false"
      weight: 3
    # Uncomment when GOOGLE_API_KEY is set:
    # - type: llm-rubric
    #   value: "Reasoning must identify Java as the primary stack, not Node.js."
    #   provider: google:gemini-1.5-flash

