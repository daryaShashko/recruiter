# ─────────────────────────────────────────────────────────
# AI Recruiter — Fast Smoke Dataset for Prompt Evaluation
# 6 representative boundary cases adapted from gold_dataset.yaml:
#   1. T01: Node.js backend-only Review match (50 <= score < 80)
#   2. T02: Hot Match Full-Stack (score >= 80)
#   3. E01: Mixed stack Node.js primary migration (score >= 80)
#   4. F08: Crypto restricted industry reject (score < 50)
#   5. F01: Low salary / Junior reject (score < 50)
#   6. E05: Title-only tech stack (score >= 50)
# Zero external grading LLM calls — all assertions are deterministic JS.
# ─────────────────────────────────────────────────────────

- description: "T01: Senior Node.js Backend Developer — Remote (backend-only Node.js, review match)"
  vars:
    title: "Senior Node.js Backend Developer"
    company: "TechFlow Solutions"
    location: "Remote (EU)"
    salary: "22,000 – 28,000 PLN net B2B"
    url: "https://justjoin.it/offers/techflow-senior-nodejs-backend-dev-12345"
    body: >-
      We are hiring a Senior Node.js Backend Developer to join our remote-first
      engineering team. You will design and build RESTful APIs using TypeScript,
      Express.js, and PostgreSQL. Experience with Docker, CI/CD, and cloud
      services (AWS/GCP) is required. Our frontend is built with React.
      Minimum 5 years of professional experience in backend development
      with Node.js. Fully remote position within EU timezone.
  assert:
    - type: javascript
      value: |
        try {
          const j = JSON.parse(output);
          if (!j) return false;
          return j.overall_score >= 50 && j.overall_score < 80;
        } catch(e) { return false; }
      weight: 3

