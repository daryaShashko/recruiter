version: "3.8"

# ============================================================
# n8n Production Stack — Oracle Cloud Always Free
# Services: postgres (n8n DB) + n8n + caddy (HTTPS)
#
# Usage:
#   cp .env.example .env  # fill in values
#   docker compose up -d
#
# ADR: ADR-010 (cloud migration), ADR-011 (cloud LLM)
# Guide: docs/cloud-migration-guide.md
# ============================================================

volumes:
  db_storage:
    name: n8n_db_storage
  n8n_storage:
    name: n8n_app_storage
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config

networks:
  n8n_net:
    driver: bridge

services:

  # ── PostgreSQL — internal n8n state ──────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    networks:
      - n8n_net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Non-root user for n8n (least-privilege)
      POSTGRES_NON_ROOT_USER: ${POSTGRES_NON_ROOT_USER:-n8n_user}
      POSTGRES_NON_ROOT_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}
    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Не открывать порт наружу — только внутренняя сеть
    expose:
      - "5432"

  # ── n8n — workflow engine ─────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: always
    networks:
      - n8n_net
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_NON_ROOT_USER:-n8n_user}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}

      # Security — MUST match local N8N_ENCRYPTION_KEY if migrating credentials
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Webhook URL — critical for Telegram and GitHub Actions
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_PORT: 5678

      # Timezone
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Warsaw}
      TZ: ${TZ:-Europe/Warsaw}

      # Performance — task runners (recommended in n8n 2.x)
      N8N_RUNNERS_ENABLED: "true"

      # Security hardening
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "true"

      # Execution history — keep last 500
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"

    volumes:
      - n8n_storage:/home/node/.n8n
      # Mount workflow JSON files for easy reference (read-only)
      - ./workflows:/home/node/workflows:ro
    expose:
      - "5678"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Caddy — HTTPS reverse proxy ───────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: always
    networks:
      - n8n_net
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
