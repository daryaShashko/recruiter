name: Prompt Evaluation

on:
  # Run on changes to prompts or eval config (push and PR)
  push:
    paths:
      - "n8n/prompts/**"
  pull_request:
    paths:
      - "n8n/prompts/**"
  # Allow manual trigger for ad-hoc evaluation runs
  workflow_dispatch:

concurrency:
  group: prompt-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Run promptfoo Eval
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      # Ollama is unavailable in GHA → override provider with Gemini via --providers flag.
      # maxConcurrency:1 is set in promptfooconfig.yaml; 22 tests × ~5–8 s ≈ 2–3 min total.
      - name: Run promptfoo eval
        working-directory: scraper
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          npx promptfoo eval \
            -c ../n8n/prompts/promptfooconfig.yaml \
            --providers google:gemini-3.1-flash-lite \
            --output promptfoo-results.json

      - name: Upload eval results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results-${{ github.run_id }}.json
          path: scraper/promptfoo-results.json
          retention-days: 7
          if-no-files-found: warn

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ Prompt eval failed%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0ABranch: ${{ github.ref_name }}"
