name: Patch n8n Workflows

on:
  workflow_dispatch:
    inputs:
      n8n_api_key:
        description: "n8n API Key (optional, falls back to N8N_API_KEY secret)"
        required: false
        type: string
      script_name:
        description: "Script to run"
        required: false
        default: "scripts/patch-n8n-hitl-review.py"
        type: string

jobs:
  patch:
    name: Patch n8n Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build n8n evaluator
        working-directory: n8n
        run: npm ci && npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run script
        env:
          N8N_API_KEY: ${{ github.event.inputs.n8n_api_key || secrets.N8N_API_KEY }}
          N8N_BASE_URL: "https://n8n-recruiter.duckdns.org"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRIPT_NAME: ${{ github.event.inputs.script_name || 'scripts/patch-n8n-hitl-review.py' }}
        run: |
          python3 "$SCRIPT_NAME"
