name: Patch n8n Workflows

on:
  workflow_dispatch:
    inputs:
      n8n_api_key:
        description: "n8n API Key"
        required: true
        type: string
      script_name:
        description: "Script to run"
        required: false
        default: "scripts/patch-n8n-hitl-review.py"
        type: string

jobs:
  patch:
    name: Patch n8n Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run script
        env:
          N8N_API_KEY: ${{ github.event.inputs.n8n_api_key }}
          N8N_BASE_URL: "https://n8n-recruiter.duckdns.org"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 ${{ github.event.inputs.script_name }}
