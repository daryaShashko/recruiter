name: AI Recruiter Scraper

on:
  # Run daily at 08:00 UTC (10:00 Warsaw time)
  schedule:
    - cron: '0 8 * * *'
  # Allow manual trigger for debugging
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not send to webhook)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scrape:
    name: Scrape Job Boards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: scraper
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: npm run scrape

      - name: Upload scraped data artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data-${{ github.run_id }}
          path: scraper/output/
          retention-days: 7
          if-no-files-found: ignore
