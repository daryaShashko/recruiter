name: n8n LLM Router Drift Check

# Fails (and alerts via Telegram) when the live "Code: LLM Router" node in the
# deployed n8n workflow no longer matches scripts/n8n-router-baseline.txt.
#
# Why: the Router node's code only ever lived inline in n8n's UI. Two separate
# hand-maintained patch scripts (scripts/p12_6_llm_router.py,
# scripts/patch_llm_router.py) each generated a different version of it, and by
# 2026-09-27 the live node matched neither. This check runs scripts/check-n8n-drift.py
# automatically so that kind of drift shows up here instead of waiting for someone
# to remember to run scripts/inspect-n8n.py by hand.

on:
  schedule:
    - cron: "0 10 * * *" # daily, after the main scrape (08:00 UTC) and its data lands
  workflow_dispatch:

jobs:
  check:
    name: Compare live Router node to committed baseline
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run drift check
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: python3 scripts/check-n8n-drift.py

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ n8n LLM Router drifted from its committed baseline%0ARun: ${RUN_URL}"
