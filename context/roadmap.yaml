  # ─────────────────────────────────────────────────────────
  # PHASE 7 — Cloud Migration (ADR-010 + ADR-011)
  # Problem solved: n8n depends on developer's laptop + unstable tunnel.
  #   This is the #1 reliability risk for unattended 24/7 operation.
  #   Additionally, Ollama on ARM CPU (no GPU) is too slow for daily batches.
  # Decision: Migrate to Oracle Cloud Always Free (ARM, 4 CPU, 24 GB RAM)
  #   with Docker Compose (n8n + Postgres + Caddy) and Cloud LLM API.
  # ADRs: ADR-010 (cloud infra), ADR-011 (cloud LLM)
  # ─────────────────────────────────────────────────────────
  P7:
    name: "Cloud Migration — Oracle Cloud + Cloud LLM"
    status: in_progress
    goal: "Migrate n8n pipeline to stable cloud infrastructure and use cloud LLMs"
    blocked_by: NONE
    depends_on: ["P6"] # P7 can be executed in parallel with P8
    adrs: ["ADR-010", "ADR-011"]
    problem_statement: >
      The current setup has a critical reliability problem: n8n runs on developer's
      laptop via an unstable public tunnel. If the laptop sleeps, loses internet, or
      the tunnel crashes — the entire pipeline silently fails. This violates the P6
      goal of "system runs unattended for 30+ days."
      Additionally, moving to cloud ARM without GPU makes local Ollama impractical
      (3-6 hours for 200 vacancies vs 15 minutes with cloud LLM API).

    sub_phases:
      "7.1 Cloud Infrastructure Provisioning":
        goal: "Get a bare server with public IP, Docker installed"
        tasks:
          CLOUD-1:
            status: done
            title: "Register Oracle Cloud account"
            verified: '2026-09-27: https://n8n-recruiter.duckdns.org answers /healthz {"status":"ok"} over HTTPS; IP 92.5.81.123 is in an Oracle network (whois).'
            owner_agent: devops
            note: "Blocked by Oracle planned maintenance (06:00–15:30 GMT 2026-05-29). Will retry after 17:30 Warsaw."
            estimate: "0.5d"
          CLOUD-2:
            status: done
            title: "Create Compute Instance (VM.Standard.A1.Flex)"
            verified: '2026-09-27: https://n8n-recruiter.duckdns.org answers /healthz {"status":"ok"} over HTTPS; IP 92.5.81.123 is in an Oracle network (whois).'
            owner_agent: devops
            note: "4 OCPU, 24 GB RAM, 200 GB boot volume, Ubuntu 22.04 aarch64"
            risk: "A1 instances may be unavailable — retry over several days or use availability script"
            estimate: "0.5d"
          CLOUD-3:
            status: done
            title: "Configure VCN Security List (Ingress Rules)"
            verified: '2026-09-27: https://n8n-recruiter.duckdns.org answers /healthz {"status":"ok"} over HTTPS; IP 92.5.81.123 is in an Oracle network (whois). Port 443 is open.'
            owner_agent: devops
            note: "Open ports: 80 (HTTP), 443 (HTTPS), 22 (SSH). Block all other inbound."
            estimate: "0.5d"
          CLOUD-4:
            status: done
