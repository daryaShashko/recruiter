            estimate: "0.5d"

      "7.2 n8n + Reverse Proxy Deployment":
        goal: "Run n8n on HTTPS with stable URL — no more tunnel"
        tasks:
          CLOUD-6:
            status: done
            title: "Configure free domain (DuckDNS or own) → server public IP"
            owner_agent: devops
            note: "Domain n8n-recruiter.duckdns.org registered on DuckDNS (2026-05-29). IP to be updated after VM creation."
            completed: "2026-05-29"
            estimate: "0.5d"
          CLOUD-7:
            status: done
            title: "Write docker-compose.yml with 3 services"
            owner_agent: devops
            note: >
              Files written to n8n/: docker-compose.yml (postgres:16-alpine + n8n:latest + caddy:2-alpine),
              Caddyfile (n8n-recruiter.duckdns.org → reverse_proxy n8n:5678, auto Let's Encrypt),
              init-data.sh (PostgreSQL non-root user init), .env.cloud.example (all vars documented).
              Migration guide: docs/cloud-migration-guide.md (12 steps, troubleshooting, checklist).
            completed: "2026-05-29"
            estimate: "1d"
          CLOUD-8:
            status: done
