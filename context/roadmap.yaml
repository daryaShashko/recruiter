  P4:
    name: "Notion Database Integration"
    status: done
    goal: "Save matches to Notion with dedup by URL"
    tasks:
      P4-1: { status: done, note: "Notion Database AI Recruiter Board created" }
      P4-2:
        { status: done, note: "docs/notion-schema.md created with full schema" }
      P4-3:
        {
          status: done,
          note: "Fields defined: Title, Company, URL, Source, Match Reason, Salary, Status, Location, Tags, Scraped At",
        }
      P4-4:
        {
          status: done,
          note: "Notion Integration Token created, added to .env and n8n",
        }
      P4-5:
        status: done
        note: >
          REWORKED 2026-05-27: replaced Notion getAll node (broken filter, urlValue vs value bug)
          with direct HTTP Request to Notion API. 3-level dedup:
          (1) Code:Dedup Batch — within-batch, fingerprint + urlNorm Sets;
          (2) HTTP POST /databases/query — OR filter: Fingerprint|urlNorm|url;
          (3) Code:Check Duplicate — parses resp.results, outputs isDuplicate boolean.
          Fingerprint = FNV1a64(normalizeCompany::normalizeTitle), 16 hex chars.
          Normalization: strip legal forms (Sp. z o.o., LLC, GmbH), strip seniority prefix.
          Enables cross-platform dedup: same job on JustJoin + NoFluffJobs → one record.
          MANUAL ACTION REQUIRED: add Fingerprint (Text) property to Evaluation Log DB in Notion.
      P4-6:
        status: done
        note: >
          IF: Already in Notion? now checks $json.isDuplicate === true (boolean, strict).
          Previously broken: checked $json.object === 'page' (loose), before that !!$json.id
          (unreliable — JobOffer has its own id field). Now isDuplicate set by Code:Check Duplicate.
      P4-7:
        status: done
        note: >
          Verified working: fingerprint written to Notion Evaluation Log on each new job.
          fingerprint field added to Code:Parse Ollama Response return (was missing, causing
          Fingerprint to be empty in Notion). FNV1a64 fallback used instead of SHA256
          (require('crypto') disallowed in n8n Code node sandbox).
      P4-8: { status: done, note: "n8n: Notion Create Page with all fields" }
      P4-9: { status: done, note: "Error handling: 400/401 from Notion API" }
      P4-10:
