  # ─────────────────────────────────────────────────────────
  # PHASE 8 — Evaluator Observability (ADR-012)
  # Problem solved: ~180 rejected vacancies/day vanish into NoOp node.
  #   No way to detect false negatives, measure accuracy, or tune prompts.
  #   Model migration (Ollama → Groq) may shift behavior undetected.
  # Decision: Log ALL evaluations, add feedback loop, build accuracy metrics.
  # ADR: ADR-012
  # ─────────────────────────────────────────────────────────
  P8:
    name: "Evaluator Observability & Feedback Loop"
    status: pending
    goal: "Full visibility into LLM decisions, human feedback, and data-driven prompt tuning"
    blocked_by: NONE
    depends_on: ["P4"] # P8 can be executed in parallel with P7
    adrs: ["ADR-012"]
    problem_statement: >
      The evaluate workflow sends ~180 rejected vacancies/day to NoOp: Discard Non-Match.
      This is a blind spot: there is no way to know if the LLM correctly rejected a
      vacancy or missed a good match. False negatives (wrongly rejected good vacancies)
      are completely invisible. Prompt tuning is guesswork without accuracy data.
      The upcoming model switch (ADR-011: Ollama → Groq/Gemini) amplifies this risk —
      without a baseline, evaluation regression is undetectable.

    sub_phases:
      "8.1 Evaluation Log (Level 1)":
        goal: "Log every LLM decision — match AND reject — in a Notion database"
        priority: HIGH
        effort: "1-2 hours"
        tasks:
          EVAL-1:
            status: done
            title: "Create Notion Evaluation Log database"
            owner_agent: n8n-specialist
            note: >-
              Done (manually). Notion DB 'Evaluation Log' created with all required fields
              including Fingerprint (Text, FNV1a64 hash — added by user beyond original schema).
              Fields: Title, Company, Fingerprint, URL, Source, Match, Reason, Score,
              Tech Stack Match, Seniority Match, Red Flags, Model, Batch ID, Evaluated At,
              Human Verdict, Tags.
              NOTION_EVAL_LOG_DB_ID set in n8n env.
            estimate: "0.5d"
          EVAL-2:
            status: done
            title: "Update evaluate.json: add Notion Log node before IF: Match?"
            owner_agent: n8n-specialist
            note: "Notion: Log to Eval Log node inserted in ingest.json between Code: Parse Ollama Response and IF: Match?. onError: continueRegularOutput. Logs all 11 fields. DB ID placeholder YOUR_EVAL_LOG_DB_ID_HERE — user replaces after EVAL-1. NOTE: evaluate.json is deprecated — all pipeline logic lives in ingest.json."
            acceptance: "Both matched and rejected vacancies appear in Evaluation Log"
            estimate: "0.5d"
          EVAL-3:
            status: done
            title: "Update docs/notion-schema.md with Evaluation Log schema"
            owner_agent: developer
            note: "docs/notion-schema.md already contains full Evaluation Log schema (added in prior session)."
            estimate: "0.5d"
          EVAL-4:
            status: done
            title: "Add NOTION_EVAL_LOG_DB_ID to env vars"
            owner_agent: devops
            note: "Done. context/env.yaml done. NOTION_EVAL_LOG_DB_ID set in n8n env and .env. GitHub Secret: manual step (done by user)."
            estimate: "0.5d"

      "8.2 Telegram Feedback (Level 2)":
        goal: "1-tap feedback on matches + ability to review rejected vacancies"
        priority: MEDIUM
        effort: "4-6 hours"
        tasks:
          EVAL-5:
            status: blocked_until_p7
            title: "Add inline keyboard buttons to Telegram match alerts"
            owner_agent: n8n-specialist
            blocked_by: "EVAL-6 (Feedback Handler) — buttons without handler = dead UX. EVAL-6 requires P7 HTTPS."
            note: >
              Technically: sending inline_keyboard is outgoing HTTP, no HTTPS needed.
              Practically: buttons appear in Telegram but clicks do nothing until EVAL-6 is active.
              Dead buttons are worse than no buttons. Implement together with EVAL-6 after P7.
              Implementation: Replace Telegram Send Message node with HTTP Request to api.telegram.org.
              Add inline_keyboard: [[{text: '\U0001f44d Correct', callback_data: 'correct:<url>'},
              {text: '\U0001f44e Wrong', callback_data: 'wrong:<url>'}]].
            estimate: "0.5d"
          EVAL-6:
            status: blocked_until_p7
            title: "Create Feedback Handler workflow"
            owner_agent: n8n-specialist
            blocked_by: "ADR-014 — Telegram setWebhook requires stable HTTPS (available after P7 CLOUD-8)"
            note: >
              Workflow JSON prepared: n8n/workflows/telegram-trigger.json (combined bot
              handles message + callback_query in one Telegram Trigger). Cannot be activated
              locally because: (1) telegramTrigger requires HTTPS webhook URL, (2) only ONE
              webhook per bot token — occupied by the main ingest/telegram-trigger workflow.
              Polling mode (additionalFields.mode) is ignored by installed n8n version UI.
              Workaround: set Human Verdict manually in Notion UI — Notion Trigger in
              feedback-handler.json still routes verdict actions automatically.
            resolved_by: "P7 CLOUD-8 (stable HTTPS) + CLOUD-10 (import telegram-trigger.json to cloud n8n)"
            estimate: "1d"
          EVAL-7:
            status: blocked_until_p7
            title: "Add /rejected and /wrong commands to Telegram trigger"
            owner_agent: n8n-specialist
            blocked_by: "ADR-014 — same Telegram webhook blocker as EVAL-6"
            note: >
              /rejected [N] — query Evaluation Log, filter Match=false,
              sort by Evaluated At desc, return last N (default 10) as Telegram messages.
              /wrong <url> — find entry in Evaluation Log by URL,
              set Human Verdict = 'Wrong – Should Match'.
              Will be added to telegram-trigger.json message branch after P7.
            estimate: "1d"
          EVAL-8:
            status: blocked_until_p7
            title: "Export new workflows to n8n/workflows/"
            owner_agent: n8n-specialist
            blocked_by: "ADR-014 — nothing to export until EVAL-6/7 are activated"
            note: >
              telegram-trigger.json already exported (combined bot, active: false).
              Final export after P7 activation will update active: true and add
              workflow IDs from cloud n8n instance.
            estimate: "0.5d"

      "8.3 Accuracy Reporting (Level 3)":
        goal: "Weekly automated accuracy report based on human-verified data"
        priority: LOW
        effort: "4-5 hours"
        blocked_by: "At least 2 weeks of Evaluation Log data with Human Verdict annotations"
        tasks:
          EVAL-9:
            status: pending
            title: "Create Weekly Report workflow"
            owner_agent: n8n-specialist
            note: >
              Cron trigger (weekly, Monday 10:00).
              Query Evaluation Log: all entries where Human Verdict != Pending.
              Calculate: total evaluated, matched, rejected, correct %, wrong %.
              Identify patterns in wrong decisions (common stacks, titles).
              Send summary to Telegram.
            estimate: "1d"
          EVAL-10:
            status: pending
            title: "Design accuracy dashboard in Notion"
            owner_agent: business-analyst
            note: "Create Notion views: 'Wrong Decisions', 'Accuracy This Week', 'All Rejected'. Use formulas for stats."
            estimate: "0.5d"

      "8.4 Dynamic Profile Tuning (Level 4 — FUTURE)":
        goal: "Change evaluator behavior from Telegram without touching n8n"
        priority: LOW
        blocked_by: "NestJS backend (future stage)"
        deferred: true
        deferred_reason: >
          Dynamic prompt generation + config management via Notion key-value store
          is fragile without a proper backend. Better implemented in NestJS stage
          with a real API and database.
        tasks:
          EVAL-11:
            status: deferred
            title: "Store evaluator profile in Notion as key-value config"
            note: "Notion page with: targetStack, rejectStack, targetLevels, location, etc."
          EVAL-12:
            status: deferred
            title: "Telegram commands for profile tuning"
            note: "/profile, /profile add-stack python, /profile remove-stack react, etc."

    execution_order:
      - "EVAL-1 → EVAL-2 → EVAL-3 → EVAL-4 (Level 1 — do first)"
      - "EVAL-5 → EVAL-6 → EVAL-7 → EVAL-8 (Level 2 — next sprint)"
      - "EVAL-9 → EVAL-10 (Level 3 — after 2 weeks of data)"
      - "EVAL-11 → EVAL-12 (Level 4 — deferred to NestJS stage)"
    primary_risks:
      - "Notion API rate limits with extra logging calls (mitigated by throttled queue)"
      - "Human review fatigue — need to actually mark Human Verdict regularly"
      - "Telegram callback_query handling complexity"
    definition_of_done:
      - "Level 1: Every LLM decision logged in Evaluation Log Notion DB"
      - "Level 2: 👍/👎 buttons work, /rejected and /wrong commands functional"
      - "Level 3: Weekly accuracy report sent to Telegram"
