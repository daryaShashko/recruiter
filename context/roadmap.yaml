  P13:
    name: "Prompt Engineering Best Practices Stack"
    status: in_progress
    goal: "Apply 5-level PE maturity to evaluator: structured output enforcement, few-shot examples, chain-of-thought, retry loop, and semantic review pass. Each level is independently deployable."
    blocked_by: ["P10", "P12"]
    depends_on: ["P10", "P12"]
    adrs: ["ADR-017"]
    problem_statement: >
      Current evaluator: zero-shot prompting, unreliable format:'json', no few-shot
      examples, no chain-of-thought, no semantic validation, no retry on failure.
      This causes: silent parse failures in n8n, logic contradictions that pass CI
      (score=85 with Crypto flag), and poor edge case accuracy on borderline jobs.
      ADR-016 adapters provide the per-provider structured output hook needed for L1.

    sub_phases:
      "13.1 Level 1 - Structured Output (JSON Schema)":
        goal: "Replace format:'json' with per-provider JSON Schema enforcement via adapters"
        tasks:
          P13-1:
            status: done
            title: "Switch Ollama adapter to JSON Schema format parameter"
            owner_agent: prompt-engineer
            skill: "Ollama grammar-constrained output"
            inputs:
              - "n8n/providers/ollama.ts"
              - "n8n/prompts/promptfooconfig.yaml"
            output: "OllamaAdapter uses format:{schema_object}; all p() helpers removed from assertions"
            acceptance: >-
              npm run eval passes 22/22 without p() parser; JSON.parse(output) works
              directly in every assertion; Ollama output always structurally valid.
            estimate: "0.3d"

          P13-2:
            status: done
            title: "Refactor all promptfoo assertions to use JSON.parse(output)"
            owner_agent: qa-engineer
            skill: "promptfoo JS assertions refactor"
            inputs:
              [
                "n8n/prompts/promptfooconfig.yaml",
                "n8n/prompts/gold_dataset.yaml",
              ]
            output: "All assertions use JSON.parse(output); p() helper deleted from all files"
            acceptance: >-
              Zero occurrences of 'function p(' in promptfooconfig.yaml and gold_dataset.yaml;
              assertion code reduced by >30%; CI green.
            estimate: "0.2d"

          P13-3:
            status: done
            title: "Update n8n ingest.json response parsing for structured output"
            owner_agent: n8n-specialist
            skill: "Ollama HTTP API, n8n Code Node"
            inputs: ["n8n/workflows/ingest.json", "n8n/providers/ollama.ts"]
            output: "ingest.json Code: Parse LLM Response uses JSON.parse(content) directly"
            acceptance: >-
              5 manual test jobs produce valid JSON; no dual-format parser logic remains;
              Code node does not contain the p() extraction pattern.
            estimate: "0.2d"

      "13.2 Level 2 - Few-Shot Prompting":
        goal: "Add 3 gold examples to system prompt for hot match, force reject, and edge case"
        tasks:
          P13-4:
            status: pending
            title: "Add few-shot examples to evaluator.md and evaluator-template.json"
            owner_agent: prompt-engineer
            skill: "Few-shot example design"
            inputs:
              - "n8n/prompts/gold_dataset.yaml"
              - "n8n/prompts/evaluator.md"
            output: "3 input/output example pairs in system prompt: T01 (>=80), F03 (score=0 crypto), E02 (50-79)"
            acceptance: >-
              System prompt contains exactly 3 <example> XML blocks with full input and output;
              npm run eval edge case accuracy improves by >=5% on E01-E05 vs baseline;
              token count increase documented in pe-tuning-log.md.
            estimate: "0.5d"

          P13-5:
            status: pending
            title: "Measure and document latency impact of few-shot examples"
            owner_agent: n8n-specialist
            skill: "Ollama performance benchmarking"
            inputs:
              [
                "n8n/workflows/ingest.json",
                "n8n/prompts/evaluator-template.json",
              ]
            output: "docs/pe-tuning-log.md: latency with/without few-shot documented"
            acceptance: >-
              Average Ollama response time measured and logged; if latency >30s, reduce to 2 examples;
              all 5 manual test jobs produce semantically correct scores.
            estimate: "0.3d"

      "13.3 Level 3 - Chain of Thought":
        goal: "Add XML thinking section so model reasons before committing to numeric score"
        tasks:
          P13-6:
            status: pending
            title: "Add <thinking> XML CoT block to evaluator system prompt"
            owner_agent: prompt-engineer
            skill: "Chain of Thought prompting, XML structuring"
            inputs:
              [
                "n8n/prompts/evaluator.md",
                "n8n/prompts/evaluator-template.json",
              ]
            output: "System prompt instructs model to reason in <thinking> before JSON; template updated"
            acceptance: >-
              Ollama output contains <thinking> block before JSON; JSON.parse correctly
              extracts JSON after </thinking>; edge case (E01-E05) pass rate improves vs baseline;
              llm-rubric reason field passes (more specific reasoning).
            estimate: "0.5d"

          P13-7:
            status: pending
            title: "Update n8n ingest.json to extract JSON from CoT output"
            owner_agent: n8n-specialist
            skill: "n8n Code Node, regex extraction"
            inputs: ["n8n/workflows/ingest.json"]
            output: "Code: Parse LLM Response extracts JSON after </thinking> tag if present"
            acceptance: >-
              5 manual test jobs with CoT output parse correctly in n8n;
              thinking content is discarded (not sent to Notion);
              jobs without <thinking> still parse correctly (backward compatible).
            estimate: "0.3d"

      "13.4 Level 4 - Retry Loop":
        goal: "Add n8n semantic validation + self-correction retry (max 2 attempts)"
        tasks:
          P13-8:
            status: pending
            title: "Add Semantic Validator Code Node to ingest.json"
            owner_agent: n8n-specialist
            skill: "n8n Code Node, semantic validation"
            inputs:
              [
                "n8n/workflows/ingest.json",
                "n8n/prompts/evaluator-template.json",
              ]
            output: "n8n Code Node 'Semantic Validator' with FORCE REJECT cross-field checks"
            acceptance: >-
              Validator flags: (1) overall_score > 0 AND red_flags contains FORCE REJECT keyword;
              (2) overall_score = 0 AND red_flags empty; (3) seniority_match < 40 AND score >= 80.
              Correctly flags 3 injected contradiction test cases;
              correctly passes 5 valid real-world job evaluations.
            estimate: "0.5d"

          P13-9:
            status: pending
            title: "Implement retry loop in n8n with error context injection"
            owner_agent: n8n-specialist
            skill: "n8n loop pattern, prompt injection"
            inputs: ["n8n/workflows/ingest.json"]
            output: "ingest.json retry flow: re-call LLM with error context if semantic validation fails (max 2)"
            acceptance: >-
              Retry fires when Semantic Validator returns retryNeeded=true;
              second attempt succeeds on >80% of contradiction cases in manual testing;
              after 2 failed retries, job logged to Notion Eval Log with status='review_needed'.
            estimate: "0.5d"

      "13.5 Level 5 - Review Pass":
        goal: "Add Gemini Flash second-pass review for borderline scores (50-79 range only)"
        tasks:
          P13-10:
            status: pending
            title: "Add Gemini Flash review node for Review-tier jobs"
            owner_agent: n8n-specialist
            skill: "Gemini Flash API, n8n HTTP Request"
            inputs:
              [
                "n8n/workflows/ingest.json",
                "n8n/prompts/evaluator-template.json",
              ]
            output: "n8n HTTP node fires Gemini review call only for jobs where overall_score is 50-79"
            acceptance: >-
              Review call fires only for 50-79 scores; result stored in Notion review_note property;
              rate limit respected (sequential, not parallel, max 15 RPM);
              Hot Matches (>=80) and Discards (<50) are NOT reviewed.
            estimate: "0.5d"

      "13.6 Level 6 - Continuous Improvement SOP":
        goal: "Formalize prompt iteration process as a documented, repeatable workflow"
        tasks:
          P13-11:
            status: pending
            title: "Write prompt-engineering-sop.md with error taxonomy"
            owner_agent: business-analyst
            skill: "Technical documentation, PE methodology"
            inputs:
              - "n8n/prompts/gold_dataset.yaml"
              - "n8n/prompts/promptfooconfig.yaml"
            output: "docs/prompt-engineering-sop.md"
            acceptance: >-
              Document covers: 4-type error taxonomy (Structural/Semantic/Boundary/Drift);
              iteration loop (run eval → classify → fix → commit → re-run);
              convergence criterion (F1 >= 0.90, 0 semantic violations);
              checklist for adding new gold_dataset cases from production failures.
            estimate: "0.3d"

          P13-12:
            status: pending
            title: "Add 5 semantic contradiction test cases to gold_dataset.yaml"
            owner_agent: qa-engineer
            skill: "Test case design"
            inputs:
              - "n8n/prompts/gold_dataset.yaml"
              - "docs/prompt-engineering-sop.md"
            output: "gold_dataset.yaml: +5 semantic cases (total 27+)"
            acceptance: >-
              5 new cases: 1 FORCE REJECT contradiction, 1 CoT reasoning mismatch,
              1 borderline salary, 1 legacy migration ambiguity, 1 remote/hybrid edge case;
              all 5 pass with correct semantic assertions; npm run eval green.
            estimate: "0.3d"

    execution_order:
      - "P13-1 → P13-2 → P13-3 (L1 Structured Output foundation)"
      - "P13-4 → P13-5 (L2 Few-Shot on top of structured output)"
      - "P13-6 → P13-7 (L3 CoT on top of few-shot)"
      - "P13-8 → P13-9 (L4 Retry loop — can run in parallel with L3)"
      - "P13-10 (L5 Review — requires P11-3 routing in place)"
      - "P13-11 + P13-12 (L6 SOP — can run in parallel with any level)"
    primary_risks:
      - "Ollama grammar-constrained decoding may conflict with CoT <thinking> prefix — test P13-6 carefully"
      - "Few-shot examples increase token count ~500 tokens — measure latency in P13-5"
      - "Gemini review pass (L5) requires GOOGLE_API_KEY and respects 15 RPM free limit"
    definition_of_done:
      - "Ollama consistently returns schema-valid JSON without p() parser helper"
      - "Few-shot examples improve edge case accuracy on E01-E05 in promptfoo eval"
      - "CoT <thinking> section present in responses; llm-rubric reason quality improves"
      - "Retry loop fires and self-corrects on 3 semantic contradiction test cases"
      - "docs/prompt-engineering-sop.md exists and is actionable"
      - "gold_dataset.yaml contains 27+ cases with semantic assertion coverage"

