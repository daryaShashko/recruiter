next_execution_plan:
  plan_id: "LOCAL-OPS-01"
  objective: "Полностью локальный, бесплатный и управляемый запуск: schedule + manual Run Now через Telegram + catch-up после офлайна"
  status: in_planning
  constraints:
    - "No paid services"
    - "Ollama local only"
    - "Notion is the only DB"
  milestones:
    M1:
      name: "Stable local runtime baseline"
      target: "Single-command local run with preflight checks"
      tasks: ["L1", "L2", "L3"]
    M2:
      name: "Telegram Run Now"
      target: "Manual command /run-now triggers pipeline end-to-end"
      tasks: ["L4", "L5", "L6"]
    M3:
      name: "Catch-up after downtime"
      target: "After offline period, process missed window safely"
      tasks: ["L7", "L8", "L9"]
    M4:
      name: "Operations hardening"
      target: "Healthchecks, runbook, and fallback modes"
      tasks: ["L10", "L11", "L12"]
  tasks:
    L1:
      status: pending
      title: "Formalize local run entrypoint"
      owner_agent: developer
      skill: "/run-local"
      inputs: ["scripts/run-local.sh", ".env", "README.md"]
      output: "Stable local launcher with clear exit codes"
      acceptance: "dry/full mode both documented and executable"
      estimate: "0.5d"
    L2:
      status: pending
