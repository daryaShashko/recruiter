known_blockers:
  - "For GitHub Actions mode only: public webhook URL must be reachable from runner (tunnel or hosted n8n); local mode has no blocker"
  - "P7 will resolve tunnel blocker by providing stable cloud HTTPS endpoint"
  - id: "BLOCKER-TG-WEBHOOK"
    title: "Telegram callback_query handler (EVAL-6/7/8) cannot be activated locally"
    affected_tasks: ["EVAL-6", "EVAL-7", "EVAL-8"]
    root_cause: >
      n8n's telegramTrigger uses Telegram's setWebhook API which requires a public HTTPS URL.
      Local n8n (localhost:5678) + localtunnel is unreliable: N8N_WEBHOOK_URL env var does
      not consistently propagate to webhook registration, and localtunnel returns 400 from
      Telegram API. Additionally, Telegram allows only ONE webhook per bot token — the
      existing telegram-trigger workflow already occupies that slot.
      The telegramTrigger polling mode (additionalFields.mode: polling) is documented but
      not exposed in the installed n8n UI version.
    workaround: >
      Human Verdict can be set manually in Notion Evaluation Log UI.
      Notion Trigger in feedback-handler.json is active and routes verdict actions
      automatically (Wrong-Match → create in Board, Wrong-Reject → mark Rejected)
      when Human Verdict changes in Notion, even without Telegram buttons.
    resolved_by: "P7 — CLOUD-8 (Caddy + Let's Encrypt stable HTTPS) + CLOUD-10 (import telegram-trigger.json)"
    adr: "ADR-014"
    prepared_fix: "n8n/workflows/telegram-trigger.json — combined bot ready to import, active: false"

