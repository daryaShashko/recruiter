            note: "Create Notion views: 'Wrong Decisions', 'Accuracy This Week', 'All Rejected'. Use formulas for stats."
            estimate: "0.5d"

      "8.4 Dynamic Profile Tuning (Level 4 — FUTURE)":
        goal: "Change evaluator behavior from Telegram without touching n8n"
        priority: LOW
        blocked_by: "NestJS backend (future stage)"
        deferred: true
        deferred_reason: >
          Dynamic prompt generation + config management via Notion key-value store
          is fragile without a proper backend. Better implemented in NestJS stage
          with a real API and database.
        tasks:
          EVAL-11:
            status: deferred
            title: "Store evaluator profile in Notion as key-value config"
            note: "Notion page with: targetStack, rejectStack, targetLevels, location, etc."
          EVAL-12:
            status: deferred
            title: "Telegram commands for profile tuning"
            note: "/profile, /profile add-stack python, /profile remove-stack react, etc."

    execution_order:
      - "EVAL-1 → EVAL-2 → EVAL-3 → EVAL-4 (Level 1 — do first)"
      - "EVAL-5 → EVAL-6 → EVAL-7 → EVAL-8 (Level 2 — next sprint)"
      - "EVAL-9 → EVAL-10 (Level 3 — after 2 weeks of data)"
      - "EVAL-11 → EVAL-12 (Level 4 — deferred to NestJS stage)"
    primary_risks:
      - "Notion API rate limits with extra logging calls (mitigated by throttled queue)"
      - "Human review fatigue — need to actually mark Human Verdict regularly"
      - "Telegram callback_query handling complexity"
    definition_of_done:
      - "Level 1: Every LLM decision logged in Evaluation Log Notion DB"
      - "Level 2: 👍/👎 buttons work, /rejected and /wrong commands functional"
      - "Level 3: Weekly accuracy report sent to Telegram"
      - "Prompt improvement cycle: data → analysis → prompt change → measure impact"

  # ─────────────────────────────────────────────────────────
  # PHASE 9 — Incremental Improvements & POC Backlog
