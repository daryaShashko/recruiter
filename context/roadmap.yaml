            acceptance: >
              Tests cover: (1) happy path — valid URL, all fields extracted, Notion page created;
              (2) HTTP 403 — fetchError=true, Telegram error reply sent, no crash;
              (3) SPA page — charCount<500, spaDetected=true, appropriate warning sent;
              (4) LLM returns invalid JSON — fallback fires, Notion page saved with partial data;
              (5) LLM returns empty tech_stack — fallback to [] without error.
            estimate: "0.3d"

    execution_order:
      - "P14-1 → P14-2 → P14-3 (can run in parallel: prompt independently)"
      - "P14-4 → P14-5 (wire-up after all inputs ready)"
      - "P14-6 → P14-7 (hardening after MVP is live)"
    primary_risks:
      - "CSR/SPA sites return <500 chars HTML (Scompler/Appify may be affected). Mitigation: spaDetected flag + user guidance."
      - "LLM extraction quality varies by site structure. Mitigation: manual test on both target sites before P14-4."
