  # ─────────────────────────────────────────────────────────
  # PHASE 10 — Lightweight Prompt Evaluation & CI/CD Pipeline (Promptfoo)
  # Problem solved: Prompt tuning is currently manual, slow, and lacks regression guardrails.
  #   Additionally, model/prompt changes can cause undetected regressions in matching quality.
  # Decision: Implement a programmatic evaluation framework (Promptfoo) + GitOps PR deployment.
  # ADR: ADR-013
  # ─────────────────────────────────────────────────────────
  P10:
    name: "Lightweight Prompt Evaluation & CI/CD Pipeline (Promptfoo)"
    status: in_progress
    goal: "Scientific prompt tuning, regression prevention, and safe GitOps rollout"
    blocked_by: NONE
    depends_on: ["P8"] # Phase 10 builds on the Notion logs and human verdicts of Phase 8
    adrs: ["ADR-013"]
    problem_statement: >
      Prompt modifications are currently guessing games. There is no automated way
      to verify that fixing a edge case in one prompt doesn't trigger regressions in other
      cases. As we transition to cloud models (Phase 7) or add new prompts (Phase 9),
      we need a baseline metric and an automated runner to measure accuracy, precision,
      recall, and cost. Furthermore, integrating Promptfoo and GitOps will ensure pure TS
      workspace stack homogeneity and safe version control via PR merge clicks from Telegram.

    sub_phases:
      "10.1 Gold Dataset & Promptfoo Config":
        goal: "Set up Promptfoo framework and compile baseline test dataset"
        priority: HIGH
        tasks:
          P10-1:
            status: done
            title: "Install promptfoo as devDependency"
            owner_agent: developer
            note: "promptfoo ^0.93.0 added to scraper/package.json devDependencies. Already installed."
            estimate: "0.2d"
          P10-2:
            status: done
            title: "Create promptfooconfig.yaml"
            owner_agent: architect
            note: "n8n/prompts/promptfooconfig.yaml created. Ollama llama3.1 provider (temp=0), file://evaluator-template.json chat prompt, default assertions (is-json + schema + URL), tests from gold_dataset.yaml. Gemini Flash llm-rubric documented as optional."
            estimate: "0.3d"
          P10-3:
            status: done
            title: "Compile baseline gold_dataset.yaml"
            owner_agent: business-analyst
            note: "n8n/prompts/gold_dataset.yaml compiled. 20 test cases: 8 true matches (Senior/Lead/Principal/Staff, Node.js/TS, Remote/Gdańsk), 7 false matches (wrong seniority/stack/location, spam), 5 edge cases (mixed stacks, misleading names, missing data). Realistic vacancy texts."
            estimate: "0.5d"

      "10.2 Hybrid Assertions & Local Verification":
        goal: "Establish zero-cost validation logic and verify execution locally"
        priority: HIGH
        tasks:
          P10-4:
            status: done
            title: "Implement JS assertions for match field"
            owner_agent: developer
            note: "3 default assertions in promptfooconfig.yaml (is-json, schema validation, URL echo) + per-test match=true/false JS assertion in each gold_dataset test case. All zero-cost, no API calls. npm scripts: eval, eval:view added to scraper/package.json."
            estimate: "0.5d"
          P10-5:
            status: pending
            title: "Integrate Gemini Flash for llm-rubric assertions"
            owner_agent: developer
            note: "Add llm-rubric checks using free Gemini Flash API to validate the reasoning text field."
            estimate: "0.5d"
          P10-6:
            status: pending
            title: "Verify local execution runner"
            owner_agent: qa
            note: "Run npx promptfoo eval and assert CLI/HTML report generation works without issues."
            estimate: "0.3d"

      "10.3 GitHub Actions Workflow":
        goal: "Integrate prompt testing into Pull Requests on GitHub"
        priority: MEDIUM
        tasks:
          P10-7:
            status: pending
            title: "Create prompt-eval.yml GHA workflow"
            owner_agent: devops
            note: "Triggers on any system prompt modification in feature branches. Runs promptfoo."
            estimate: "0.5d"
          P10-8:
            status: pending
            title: "Configure promptfoo test execution in GHA"
            owner_agent: devops
            note: "Set up dependencies, local Ollama or cloud tokens, run evaluations, and export JSON results."
            estimate: "0.5d"

      "10.4 Telegram GitOps Merge Hook":
        goal: "Deploy prompt updates safely using GitOps and Telegram click callbacks"
        priority: MEDIUM
        tasks:
          P10-9:
            status: pending
            title: "Create n8n PR notification workflow"
            owner_agent: n8n-specialist
            note: "Parses GHA promptfoo JSON. Sends F1-score/diff reports and inline keyboard to Telegram."
            estimate: "0.5d"
          P10-10:
            status: pending
            title: "Build GitHub API PR Merge webhook in n8n"
            owner_agent: n8n-specialist
            note: "Sends POST request to GitHub pulls merge API on clicking Apply Prompt."
            estimate: "0.5d"
          P10-11:
            status: pending
            title: "Configure live production pull trigger"
            owner_agent: devops
            note: "Pulls main branch automatically to production server upon successful branch merge."
            estimate: "0.5d"

      "10.5 Downstream Generalization":
        goal: "Extend prompt evaluation pipeline to other system prompts"
        priority: LOW
        tasks:
          P10-12:
            status: pending
            title: "Support generalized prompt targets"
            owner_agent: n8n-specialist
            note: "Adapt promptfooconfig.yaml to evaluate company_analyzer and entity_extractor prompts."
            estimate: "0.5d"
          P10-13:
            status: pending
            title: "Establish secondary gold datasets"
            owner_agent: business-analyst
            note: "Create focused validation datasets and distinct grading rubrics for generalized prompts."
            estimate: "0.5d"

    execution_order:
      - "P10-1 → P10-2 → P10-3 (Config & Dataset)"
      - "P10-4 → P10-5 → P10-6 (Assertions)"
      - "P10-7 → P10-8 (CI/CD Workflow)"
      - "P10-9 → P10-10 → P10-11 (Telegram GitOps)"
      - "P10-12 → P10-13 (Generalization)"
    primary_risks:
      - "Ollama timeout during CI/CD execution (mitigated by custom timeouts or cloud model providers)"
      - "Overfitting system prompts to the gold dataset while losing general accuracy"
      - "Github REST API token expiration (mitigated by durable n8n credential secrets)"
    definition_of_done:
      - "Promptfoo installed and gold dataset compiled locally"
      - "F1-scores, precision, and recall calculated locally via javascript and llm-rubric assertions"
      - "Pull requests automatically execute prompt evaluations on GitHub Actions"
      - "n8n notifies user of test results and merges branch programmatically via GitHub REST API"
      - "Production live code successfully pulls the merged prompt"

  P11:
    name: "Multidimensional Scoring & Intelligent Routing"
    status: pending
    goal: "Transition job evaluation to a 0-100 multidimensional scoring system with high/medium/low routing tiers"
    blocked_by: ["P8", "P10"]
    depends_on: ["P8", "P10"]
    adrs: []
    problem_statement: >
      A binary yes/no classifier causes borderline candidates/vacancies to be hard-rejected.
      Additionally, it does not allow dynamic prioritization or sorting in Notion.
      We need to replace this with a multi-criteria scoring system that splits vacancies
      into Hot Matches, Review, and Discard, optimizing the recruiter's pipeline.

    sub_phases:
      "11.1 Core Prompt & Notion MVP":
        goal: "Deploy the multidimensional evaluator prompt and configure n8n score-based routing"
        tasks:
          P11-1:
            status: pending
            title: "Rewrite system prompt for 0-100 scoring"
            owner_agent: prompt-engineer
            note: "Modify evaluator.md and evaluator-template.json to output JSON: overall_score, tech_stack_match, seniority_match, red_flags array."
            estimate: "0.3d"
          P11-2:
            status: pending
            title: "Update Notion DB schemas and mappings"
            owner_agent: n8n-specialist
            note: "Document and add properties: Score (Number), Red Flags (Multi-select), Tech Stack Match (Number), Seniority Match (Number)."
            estimate: "0.2d"
          P11-3:
            status: pending
            title: "Implement score routing Switch node in n8n"
            owner_agent: n8n-specialist
            note: "Replace binary IF node with Switch node in ingest.json. Route: >=80 (Hot Match to Telegram/Notion), 50-79 (Review to Notion silently), <50 (Discard to Eval Log)."
            estimate: "0.4d"

      "11.2 QA Validation & CI Hardening":
        goal: "Configure promptfoo test suites to assert on scores and prevent regressions"
        tasks:
          P11-4:
            status: pending
            title: "Update promptfooconfig.yaml assertions"
            owner_agent: qa-engineer
            note: "Add JS assertions validating the structure of overall_score, tech_stack_match, seniority_match, and red_flags array."
            estimate: "0.2d"
          P11-5:
            status: pending
            title: "Re-assert gold_dataset.yaml tests"
            owner_agent: qa-engineer
            note: "Update assertion criteria in gold_dataset.yaml. Assert >=80 for T cases, >=50 for E cases, and <50 with red flags for F cases."
            estimate: "0.4d"
          P11-6:
            status: pending
            title: "Verify prompt score accuracy locally"
            owner_agent: developer
            note: "Execute npm run eval locally to verify accuracy and ensure F1-score/error rates are within acceptable thresholds."
            estimate: "0.2d"

      "11.3 Observability & Tuning":
        goal: "Deploy monitoring and establish continuous prompt feedback tuning"
        tasks:
          P11-7:
            status: pending
            title: "Document threshold tuning SOP"
            owner_agent: business-analyst
            note: "Write docs/scoring-tuning-guide.md to define the operational process for shifting routing thresholds based on market trends."
            estimate: "0.3d"
          P11-8:
            status: pending
            title: "Integrate Telegram feedback callbacks with scoring"
            owner_agent: n8n-specialist
            note: "Update n8n feedback-handler to register thumbs up/down user reviews against the numeric score metrics."
            estimate: "0.4d"
          P11-9:
            status: pending
            title: "Expose weekly score analytics digest"
            owner_agent: business-analyst
            note: "Update weekly digest workflow to compute and alert on average scores, volume distributions, and major red flag patterns."
            estimate: "0.3d"

    execution_order:
      - "P11-1 → P11-2 → P11-3 (MVP Deploy)"
      - "P11-4 → P11-5 → P11-6 (Test Hardening)"
      - "P11-7 → P11-8 → P11-9 (Ops & Tuning)"
    primary_risks:
      - "Model variance causing scoring drift on border cases"
      - "Increased latency from larger JSON schema outputs"
    definition_of_done:
      - "System evaluator prompt returns structured 4-metric score JSON"
      - "n8n pipeline routes jobs safely to Telegram and Notion boards based on thresholds"
      - "All 20 test cases in gold_dataset are validated with scoring assertions and CI passes"
      - "Weekly statistics track score metrics and red flag distributions"

next_execution_plan:
  plan_id: "LOCAL-OPS-01"
  objective: "Полностью локальный, бесплатный и управляемый запуск: schedule + manual Run Now через Telegram + catch-up после офлайна"
  status: in_planning
  note: "This plan was designed for local-only mode. With P7 (Cloud Migration), some tasks become simpler (no tunnel) or change scope. Review after P7 completion."
  constraints:
    - "No paid services"
    - "Ollama local only"
    - "Notion is the only DB"
  milestones:
    M1:
      name: "Stable local runtime baseline"
      target: "Single-command local run with preflight checks"
      tasks: ["L1", "L2", "L3"]
    M2:
      name: "Telegram Run Now"
      target: "Manual command /run-now triggers pipeline end-to-end"
      tasks: ["L4", "L5", "L6"]
    M3:
      name: "Catch-up after downtime"
      target: "After offline period, process missed window safely"
