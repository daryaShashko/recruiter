github_actions_deactivation_plan:
  plan_id: "GHA-OFF-01"
  objective: "Отключить GitHub Actions scheduled execution для перехода в полностью локальный режим"
  status: pending
  mode_options:
    SOFT_OFF:
      description: "Оставить workflow_dispatch, отключить только schedule"
      effect: "Нет автозапуска по cron, manual запуск в Actions UI доступен"
    HARD_OFF:
      description: "Отключить workflow в GitHub UI (Disable workflow)"
      effect: "Ни cron, ни manual запуск не выполняются до повторного Enable"
  tasks:
    G1:
      status: pending
      title: "Architecture decision for off mode"
      owner_agent: architect
      skill: "/adr-check"
      output: "Decision record: SOFT_OFF or HARD_OFF"
      acceptance: "Chosen mode documented with rollback path"
    G2:
      status: pending
      title: "Apply workflow config changes"
      owner_agent: devops
      skill: "/release-readiness"
      output: "Workflow aligned with chosen off mode"
      acceptance: "No unintended scheduled runs remain"
    G3:
      status: pending
      title: "Disable workflow in GitHub UI if HARD_OFF"
      owner_agent: devops
      skill: "GitHub Actions operations"
      output: "Workflow state switched to Disabled"
      acceptance: "Actions page shows workflow disabled"
    G4:
      status: pending
      title: "Post-change validation"
      owner_agent: qa
      skill: "/weekly-health-check"
      output: "Verification report for cron/manual behavior"
      acceptance: "Expected triggers behave exactly per selected mode"
    G5:
      status: pending
      title: "Operator runbook update"
      owner_agent: business-analyst
      skill: "Operational SOP writing"
      output: "Runbook section for disable/enable Actions"
      acceptance: "Any operator can execute toggle in <5 minutes"
    G6:
      status: pending
      title: "Prompt updates for ops toggles"
      owner_agent: prompt-engineer
      skill: "agent-customization"
      output: "Prompt commands for disable/enable checks"
      acceptance: "Deterministic command output for off/on operations"
  execution_order:
    - "G1 -> G2 -> G3 -> G4 -> G5 -> G6"
  rollback:
    - "If SOFT_OFF: restore schedule block in .github/workflows/scraper.yml"
    - "If HARD_OFF: GitHub Actions UI -> Enable workflow"
  documentation:
    - "docs/github-actions-disable-plan.md"
    - "docs/local-ops-plan.md"

post_poc_improvements:
  description: "Улучшения после завершения POC (P0-P6). Не блокируют запуск."
  IMPROVE-1:
    title: "Telegram: убрать n8n-брендинг"
    note: "Заменить Telegram-узел на HTTP Request к api.telegram.org/sendMessage — footer исчезнет"
    priority: HIGH
  IMPROVE-2:
    title: "Telegram: улучшить формат сообщения"
    note: "HTML parse_mode, секции: вакансия / зарплата / локация / причина матча. Читабельный вид."
    priority: HIGH
  IMPROVE-3:
    title: "Company research: Ollama из текста вакансии"
    note: "Второй Ollama-вызов после match:true — аутсорс/продукт, размер команды, культура. Без доп. запросов."
    priority: MEDIUM
  IMPROVE-4:
    title: "Company research: scrape сайта компании"
    note: "HTTP GET company-domain/about → текст → Ollama summarize → секция в Telegram-сообщении"
    priority: LOW
  IMPROVE-5:
    title: "Universal manual intake via Telegram"
    note: >
      Пользователь шлёт боту любой текст или ссылку.
      IF URL → HTTP GET страница → extract body text.
      IF текст (LinkedIn сообщение, копипаст) → использовать как есть.
      Wrap в JobOffer { source: manual } → evaluate → notify.
      Отдельные источники: Gmail Trigger (n8n), LinkedIn (требует auth — сложно).
    priority: HIGH
    sources:
      - Любой текст / сообщение от рекрутера из LinkedIn
      - Прямая ссылка на корпоративный карьер-сайт (HTTP GET)
      - Gmail письмо (отдельный Gmail Trigger воркфлоу)
      - LinkedIn URL (проблема авторизации — решать отдельно)
  IMPROVE-6:
    title: "Telegram Run Now + Catch-up after downtime"
    note: >
      Добавить команду /run-now в Telegram (manual trigger) и режим догоняющего запуска:
      хранить last_successful_run_at, после офлайна запускать сбор за пропущенный интервал.
      Цель: запуск по расписанию + ручная кнопка после простоя.
    priority: HIGH

