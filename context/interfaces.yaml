# ============================================================
# TYPESCRIPT INTERFACES MANIFEST
# Source of truth for all TypeScript interfaces/types.
# Update this file when: types.ts changes.
# Source file: scraper/src/types.ts
# ============================================================

interfaces:
  JobOffer:
    file: scraper/src/types.ts
    description: >
      Unified job offer. ALL scrapers must normalize output to this shape.
      Never extends this interface — add optional fields instead.
    fields:
      id:
        type: string
        required: true
        format: "{source}_{slug|id}"
        examples: ["justjoin_senior-nodejs-dev-abc123", "nofluffjobs_abc456def"]
        rule: "id prefix MUST match the source field value"
      title:
        type: string
        required: true
        example: "Senior Node.js Developer"
      company:
        type: string
        required: true
      url:
        type: string
        required: true
        note: "PRIMARY KEY for Notion deduplication — must be the canonical job page URL"
      body:
        type: string
        required: true
        fallback: "Use title if API doesn't return description (scrapers do this)"
        note: "Truncate to ~1500 chars before sending to Ollama (8k context window)"
      source:
        type: "'justjoin' | 'nofluffjobs' | 'linkedin' | 'manual'"
        required: true
      location:
        type: string
        required: false
        values: ["city name", "Remote", "Unknown"]
      salary:
        type: string
        required: false
        format: "'{from}–{to} {currency}'"
        examples: ["15000–20000 PLN", "120–160 EUR/day (B2B)"]
      scrapedAt:
        type: string
        required: true
        format: ISO 8601
        set_at: normalization time in scraper

  WebhookPayload:
    file: scraper/src/types.ts
    description: "Envelope sent by sender.ts to n8n webhook"
    fields:
      jobs:
        type: "JobOffer[]"
        required: true
      meta.source:
        type: string
        required: true
        value: "'scraper-combined' (from index.ts)"
      meta.count:
        type: number
        required: true
        note: "Same as jobs.length"
      meta.sentAt:
        type: string
        required: true
        format: ISO 8601

  EvaluationResult:
    file: scraper/src/types.ts
    description: "LLM response from Ollama — parsed in n8n Code node"
    fields:
      match:
        type: boolean
        required: true
      reason:
        type: string
        required: true
        constraint: "ONE sentence only"
      url:
        type: string
        required: true
        note: "Echoed from the user message — used for traceability"
    critical_notes:
      - "LLM MUST return ONLY this JSON — no markdown, no explanation outside JSON"
      - "Parse from: response.message.content (Ollama) or response.choices[0].message.content (Groq/Gemini)"
      - "Add try/catch in n8n Code node — LLM may wrap in markdown code blocks"
      - "If parsing fails, default to { match: false, reason: 'Parse error', url: $json.url }"

  # ── ADR-012: Evaluation Log (planned, Phase 8) ───────────
  EvaluationLogRecord:
    file: "Notion Evaluation Log DB (not a TypeScript type — Notion page schema)"
    description: >
      Represents one row in the Evaluation Log Notion database.
      Created for EVERY vacancy that passes through the LLM evaluator — both matched and rejected.
      Used for accuracy tracking, false-negative detection, and prompt tuning.
    fields:
      title:
        type: string (Notion Title)
        required: true
        note: "Job title"
      company:
        type: string (Notion Text)
        required: true
      url:
        type: string (Notion URL)
        required: true
        note: "Same URL used for dedup in AI Recruiter Board"
      source:
        type: select
        required: true
        values: ["justjoin", "nofluffjobs", "linkedin", "manual"]
      match:
        type: boolean (Notion Checkbox)
        required: true
        note: "LLM decision: true = relevant, false = rejected"
      reason:
        type: string (Notion Text)
        required: true
        note: "Verbatim LLM reason, one sentence"
      model:
        type: string (Notion Text)
        required: true
        note: "LLM model used: llama3.1, groq-llama3, gemini-flash, etc."
      batch_id:
        type: string (Notion Text)
        required: true
        format: ISO 8601 timestamp
        note: "Groups all evaluations from the same pipeline run"
      evaluated_at:
        type: date (Notion Date)
        required: true
      human_verdict:
        type: select (Notion Select)
        required: false
        default: "Pending"
        values: ["Correct", "Wrong – Should Match", "Wrong – Should Reject", "Pending"]
        note: "Set manually by user after reviewing the LLM decision"
      tags:
        type: multi-select (Notion Multi-select)
        required: false
        note: "Tech stack tags from vacancy, for pattern analysis"
    critical_notes:
      - "This is a Notion DB schema, not a TypeScript interface"
      - "Log node placement: AFTER Code: Parse Ollama Response, BEFORE IF: Match?"
      - "Must log both match:true AND match:false decisions"
      - "Human Verdict defaults to Pending — updated via Telegram feedback or manual review"

