# new integration added, project goal evolves.
# ============================================================

project:
  name: ai-recruiter-pipeline
  description: >
    Automated IT job scraper with LLM evaluation.
    Collects job offers from JustJoin.it and NoFluffJobs via Playwright,
    evaluates them with LLM (local Ollama or cloud Groq/Gemini), saves matches to Notion,
    and sends Telegram alerts — triggered daily by GitHub Actions.
    Planned: migration to Oracle Cloud Always Free (ADR-010/011) and
    evaluator observability with feedback loop (ADR-012).
  stage: early_development # early_development | active | stable | maintenance
  version: 0.1.0

goal:
  user: Senior IT professional (Senior/Tech Lead/Solution Architect)
  stack: JavaScript, TypeScript, Node.js, React, PostgreSQL
  location: Gdańsk, Poland OR fully remote EU
  outcome: Find matching jobs without manual scrolling, reviewed daily via Notion Kanban

tech_stack:
  scraper:
    language: TypeScript 5.5
    runtime: Node.js 20
    browser_automation: Playwright 1.45
    http_client: axios 1.7
    runner: ts-node 10.9
    testing: jest 29 + ts-jest 29
  pipeline:
    workflow_engine: "n8n (local; planned: Oracle Cloud Always Free — ADR-010)"
    llm: "Ollama llama3.1:latest (local); planned: Groq/Gemini free-tier API (ADR-011)"
  storage:
    primary_database: Notion API (kanban board + dedup source)
    evaluation_log: "Notion Evaluation Log (planned — ADR-012)"
    n8n_internal: "SQLite (local); planned: PostgreSQL in Docker (ADR-010)"
  alerts:
    bot: Telegram Bot API
  ci_cd:
    platform: GitHub Actions (ubuntu-latest, free tier)
    schedule: "0 8 * * * (08:00 UTC = 10:00 Warsaw)"
  infrastructure_planned:
    server: "Oracle Cloud Always Free — Ampere A1 (4 vCPU, 24 GB RAM)"
    reverse_proxy: "Caddy (auto-TLS via Let's Encrypt)"
    monitoring: "UptimeRobot (free tier)"

architecture:
  # Full diagram: see docs/architecture.md
  data_flow:
    - step: 1
      from: GitHub Actions (ubuntu runner)
      action: Run Playwright scraper
      output: "JobOffer[] array"
    - step: 2
      from: scraper/src/sender.ts
      action: POST WebhookPayload to n8n
      output: "{ jobs: JobOffer[], meta: {...} }"
    - step: 3
      from: n8n Webhook
      action: >
        Normalize (urlNorm + fingerprint + dedupFilter per job) ->
        Dedup Batch (within-batch fingerprint + URL dedup) ->
        Split per job ->
        HTTP query Notion API (OR: fingerprint | urlNorm | url) ->
        Check Duplicate (isDuplicate flag)
      output: "individual JobOffer items with isDuplicate=false (duplicates skipped)"
      dedup_levels: 3
      dedup_note: "ADR-015 — semantic fingerprint dedup, cross-platform capable"
    - step: 4
      from: n8n HTTP Request
      action: "Evaluate each job with LLM (local Ollama or cloud Groq/Gemini)"
      output: "{ match: boolean, reason: string, url: string }"
    - step: 4.5
      from: n8n Notion Create Page (planned — ADR-012)
      action: "Log evaluation result (match AND reject) to Evaluation Log DB"
      output: "Evaluation Log record created"
    - step: 5
      from: n8n IF node (match === true)
      action: Save to Notion Board + send Telegram alert
      output: "Notion page created, Telegram message sent"

current_phase: P7 # P0–P5 done, P6 in_progress (6/7), P7+P8 proposed
# See context/roadmap.yaml for detailed task status

structure:
  scraper/: "TypeScript/Playwright job scraper — ts-node project"
  n8n/: "n8n workflow JSONs + LLM prompts"
  scripts/: "Local run entrypoints (run-local preflight + health summary)"
  docs/: "Architecture diagrams, schemas, ADRs, agent skill files"
  docs/adr/: "Architecture Decision Records (ADR-001 through ADR-016)"
  docs/agents/: "AI agent system prompt files (8 agents)"
  context/: "THIS — project context manifests (YAML)"
  .github/: "GitHub Actions CI/CD workflows"

