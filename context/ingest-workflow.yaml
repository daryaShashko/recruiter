# ============================================================
# INGEST WORKFLOW MAP
# Compact reference for n8n/workflows/ingest.json — a local-only export: gitignored
# (personal IDs), not in the repository. Export it from the n8n UI if you need it.
#
# How to use:
#   Overview / flow     → read this file (fits in context)
#   Node code/params    → grep the local export: grep -A 30 '"name": "Code: LLM Router"' n8n/workflows/ingest.json
#
# Update this file when:
#   - a node is added or removed
#   - routing logic changes (thresholds, LLM providers, dedup)
#   Do NOT update for code-only changes inside a node.
# ============================================================

workflow:
  name: Ingest Jobs
  file: n8n/workflows/ingest.json  # local-only export, gitignored
  purpose: >
    Receives WebhookPayload{jobs[], meta} from scraper → deduplicates via
    3-level FNV1a64+urlNorm+url check against Notion → evaluates each job
    via LLM → routes to Notion Kanban + optional Telegram alert.

# ─── LINEAR FLOW ───────────────────────────────────────────
# Read top-to-bottom. Branches shown inline as true/false.
flow:
  - node: "Webhook: POST /jobs/ingest"
    desc: Entry point, POST /jobs/ingest

  - node: "Respond to Webhook: 200"
    desc: Immediately returns {"ok":true} 200 before async processing

  - node: "IF: Zero jobs check"
    desc: "jobs.length == 0?"
    true: "→ Telegram: Zero Jobs Alert (end)"
    false: "→ Code: Normalize Jobs"

  - node: "Code: Normalize Jobs"
    desc: Normalizes all jobs; adds fingerprint, urlNorm, dedupFilter per item

  - node: "Code: Dedup Batch"
    desc: In-memory dedup on fingerprint + urlNorm + url; logs dropped items

  - node: "Split In Batches: 1"
    desc: Loops one job at a time
    done_output: "→ NoOp: All Done"
    item_output: "→ Switch: Route by Source"

  - node: "Switch: Route by Source"
    desc: Routes on $json.source
    outputs:
      0_justjoin: "→ Notion: Find Existing URL"
      1_nofluffjobs: "→ Notion: Find Existing URL"
      2_manual: "→ Notion: Find Existing URL"
      3_fallback: "→ Code: Unknown Source → Notion: Find Existing URL"

  - node: "Notion: Find Existing URL"
    desc: POST Notion DB query with OR filter (fingerprint / urlNorm / url)

  - node: "Code: Check Duplicate"
    desc: Sets isDuplicate=true/false; logs match reason (fingerprint|url|notion-match)

  - node: "IF: Already in Notion?"
    desc: "isDuplicate == true?"
    true: "→ NoOp: Skip Duplicate → back to Split In Batches: 1"
    false: "→ Read Candidate Profile → Notion: Read Matching Criteria → Code: Build Ollama Payload"

  - node: "Read Candidate Profile"
    desc: Queries active CV rows from Notion with the existing notionApi credential

  - node: "Notion: Read Matching Criteria"
    desc: Queries active Matching Criteria rows from Notion for each new job

  - node: "Code: Build Ollama Payload"
    desc: Builds the system prompt from current Notion CV and criteria; on read failure sets profileError, never uses a local fallback

  - node: "Code: LLM Router"
    desc: "LLM call; ollama|gemini|anthropic. Provider from LLM_PROVIDER env (p12_6 version) or hardcoded (CLOUD-11-A version) — see llm_providers"

  - node: "Code: Parse Ollama Response"
    desc: >
      Parses LLM JSON; normalizes red_flags to taxonomy; programmatic heuristics
      (wrong city, outsourcing, crypto, gambling) can override score to 0

  - node: "Notion: Log to Eval Log"
    desc: Always writes evaluation result to Evaluation Log DB

  - node: "Code: Restore Job Payload"
    desc: Re-attaches original job fields from Split In Batches context

  - node: "IF: Score >= 80?1"
    desc: "overall_score >= 80?"
    true: "→ Notion: Create Page (Hot Match) → Telegram: Send Alert → Notion: Update Log with TG Info → loop"
    false: "→ IF: Score >= 50?2"

  - node: "IF: Score >= 50?2"
    desc: "overall_score >= 50?"
    true: "→ Notion: Create Page (Review) → loop"
    false: "→ NoOp: Discard Non-Match → loop"

# ─── KEY BUSINESS LOGIC ────────────────────────────────────
key_logic:
  scoring:
    hot_match: "overall_score >= 80  → Notion Board (Hot Match) + Telegram alert"
    review: "overall_score 50-79  → Notion Board (Review, silent)"
    discard: "overall_score < 50   → Eval Log only"
    force_zero: >
      Live parser embeds tested n8n/evaluator/scoring.ts. Programmatic hard rejects:
      crypto/Web3, gambling, outsourcing, and disclosed salary below the Notion floor
      after converting the supported currencies to monthly PLN. Non-JS languages are
      critical only when required; a nice-to-have is not a reject. Fully remote jobs
      worldwide have no location penalty; on-site/hybrid outside Tricity and explicitly
      US/Canada-residence-restricted remote jobs get a 10-point penalty and a flag.
      On Notion read failure/incomplete results, fail closed (score 0, Pipeline: Notion
      Error) without using a local profile fallback; the decision reaches Eval Log.

  dedup_strategy:
    level_1_fingerprint: "FNV1a64( normalizeCompany(company) + '::' + normalizeTitle(title) )"
    level_2_urlNorm: "URL hostname+pathname, lowercase, trailing slash stripped"
    level_3_raw_url: "Raw URL from scraper"
    batch_dedup: "In-memory Set (Code: Dedup Batch) — prevents duplicate Notion queries"
    notion_dedup: "Notion OR-filter on Fingerprint + urlNorm + url (Notion: Find Existing URL)"

  llm_providers:
    source: >
      Inline code of Code: LLM Router, updated and verified against the live n8n API on
      2026-10-29. Fallback order is PROVIDER_ORDER = ['gemini:gemini-2.5-flash-lite',
      'gemini:gemini-3.1-flash-lite', 'gemini:gemini-2.5-flash', 'gemini:gemini-3.5-flash',
      'openrouter:openrouter/free'] with up to 2 attempts per Gemini model on 429/5xx and
      safe fallback object return (instead of throwing and aborting Split In Batches).
      GEMINI_API_KEY is read from $env.GEMINI_API_KEY; OpenRouter uses the openrouter/free
      auto-router (hardcoded 2025 :free model slugs and gemini-2.0-flash were retired
      upstream and returned HTTP 404).
      Two old generator scripts exist and are both stale: scripts/p12_6_llm_router.py
      ($env.LLM_PROVIDER, fetch) and scripts/patch_llm_router.py (CLOUD-11-A, hardcoded
      single provider, this.helpers.httpRequest) — neither reflects the live fallback-chain
      code described above.
    ported_to_ts: >
      n8n/evaluator/router.ts (Jest-tested) ports this fallback logic verbatim, reusing
      the already-existing n8n/providers/*.ts adapters (ADR-016) instead of a third
      reimplementation. Not yet wired into the live n8n workflow — see ADR-019.
    deployed: >
      Checked 2026-09-27 (and re-confirmed 2026-10-05) with scripts/inspect-n8n.py against
      the cloud n8n: Ingest Jobs is active, 27 nodes; scripts/check-n8n-drift.py now runs
      this check automatically (daily GH Action) instead of only on manual request.
    output_schema: "{ overall_score, tech_stack_match, seniority_match, red_flags[], reason, url }"

  telegram_alert:
    trigger: "Hot Match (score >= 80) only"
    format: "Title, company, salary, location, source, URL, reason + inline keyboard: Correct / Should Match / Should Reject"
    retry: "maxTries=3, waitBetweenTries=3000ms"

  notion_databases:
    eval_log: "DB 36c747f7-ebec-80c8-bfd7-ed317f4a7c35 — every job logged here"
    hot_match: "separate Kanban DB — only score >= 80"
    review: "separate Kanban DB — score 50-79"
