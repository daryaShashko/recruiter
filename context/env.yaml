# ============================================================
# ENVIRONMENT VARIABLES MANIFEST
# All env vars used anywhere in the project.
# Update this file when: new env var added, usage changes.
# NEVER commit actual values — only metadata here.
# ============================================================

env_vars:
  WEBHOOK_URL:
    used_in: [scraper, github_actions]
    description: "n8n tunnel URL for the job ingest webhook"
    format: "https://{hash}.hooks.n8n.cloud/webhook/jobs/ingest"
    example: "https://abc123.hooks.n8n.cloud/webhook/jobs/ingest"
    required: true
    secret: true
    storage: [.env (local), GitHub Secrets (CI)]
    set_where: "n8n --tunnel output → copy to .env and GitHub Secret"

  WEBHOOK_BATCH_SIZE:
    used_in: [scraper]
    description: "How many job offers are sent per webhook POST request"
    format: "positive integer"
    default: "25"
    example: "10"
    required: false
    secret: false
    storage: [.env (local)]
    note: "Lower value reduces load on local n8n/Ollama by splitting ingestion into smaller requests"

  NOTION_TOKEN:
    used_in: [n8n]
    description: "Notion Internal Integration Token"
    format: "secret_..."
    required: true
    secret: true
    storage: [n8n credentials, .env (local)]
    set_where: "notion.so/my-integrations → Create integration → copy token"

  NOTION_DB_ID:
    used_in: [n8n]
    description: "Notion database ID for AI Recruiter Board"
    format: "32-character hex string (from Notion page URL)"
    required: true
    secret: false
    storage: [n8n workflow, .env (local)]
    set_where: "Notion DB URL: notion.so/Name-{DATABASE_ID}?v=..."

  TELEGRAM_BOT_TOKEN:
    used_in: [n8n]
    description: "Telegram Bot API token for sending alerts"
    format: "{bot_id}:{hash}"
    required: true
    secret: true
    storage: [n8n credentials, .env (local)]
    set_where: "@BotFather on Telegram → /newbot → copy token"

  TELEGRAM_CHAT_ID:
    used_in: [n8n]
    description: "Telegram chat ID where alerts are sent"
    format: "negative integer for group, positive for DM"
    required: true
    secret: false
    storage: [n8n workflow, .env (local)]
    set_where: "Send message to bot → check getUpdates API response"

  OLLAMA_HOST:
    used_in: [n8n]
    description: "Base URL for Ollama API (legacy — superseded by LLM_BASE_URL in ADR-016)"
    default: "http://localhost:11434"
    required: false
    secret: false
    note: "Kept for backwards compatibility. Use LLM_BASE_URL instead."

  DRY_RUN:
    used_in: [scraper, github_actions]
    description: "Skip webhook POST — scrape but don't send"
    values: ["true", "false"]
    default: "false"
    required: false
    secret: false
    set_where: "workflow_dispatch input in GitHub Actions, or .env locally"

  # ── LLM Provider Adapter (ADR-016) ───────────────────────
  LLM_PROVIDER:
    used_in: [n8n]
    description: "Which LLM provider to use for vacancy evaluation"
    values: ["ollama", "gemini", "anthropic"]
    default: "ollama"
    required: false
    secret: false
    storage: [n8n environment, .env (local)]
    note: >
      Read by the n8n Code: LLM Router node only in the scripts/p12_6_llm_router.py version
      ($env.LLM_PROVIDER). The later scripts/patch_llm_router.py version (CLOUD-11-A)
      hardcodes provider, model, and key, so switching means editing the node code. Which
      version runs is known only from the local export or n8n. LLM_BASE_URL, LLM_MODEL, and
      LLM_API_KEY follow the same rule. promptfoo (npm run eval) reads LLM_PROVIDER separately,
      as a promptfoo provider ID (for example ollama:chat:llama3.1:latest).

  LLM_BASE_URL:
    used_in: [n8n]
    description: "Base URL for the LLM API (Ollama only; ignored for cloud providers)"
    format: "http(s)://host:port"
    default: "http://localhost:11434"
    required: false
    secret: false
    storage: [n8n environment, .env (local)]
    note: "Only set when Ollama runs on a non-default host (e.g. Docker, remote machine)"

  LLM_MODEL:
    used_in: [n8n]
    description: "Model name for the selected LLM provider"
    default: "llama3.1:latest (ollama) / gemini-2.0-flash (gemini) / claude-haiku-4-5 (anthropic)"
    required: false
    secret: false
    storage: [n8n environment, .env (local)]

  LLM_API_KEY:
    used_in: [n8n]
    description: "API key for cloud LLM provider (Gemini or Anthropic)"
    format: "provider-specific API key string"
    required: "Only when LLM_PROVIDER is gemini or anthropic"
    secret: true
    storage: [n8n credentials, .env (local), GitHub Secrets (CI)]
    set_where: "aistudio.google.com (Gemini) or console.anthropic.com (Anthropic)"

  OPENROUTER_API_KEY:
    used_in: [n8n]
    description: "API key for OpenRouter fallback LLM (used when Gemini returns 429/503)"
    format: "sk-or-v1-..."
    required: "Only when OpenRouter fallback is enabled (P15-5)"
    secret: true
    storage: [n8n credentials, .env (local)]
    set_where: "openrouter.ai/keys → Create key (free account, no credit card required)"
    note: "ADR-016 extension — OpenRouter is best-effort fallback only; no SLA on free models"

  OPENROUTER_MODEL:
    used_in: [n8n]
    description: "Model identifier for OpenRouter fallback"
    format: "provider/model-name (OpenRouter model ID format)"
    default: "deepseek/deepseek-chat-v3-0324:free"
    required: false
    secret: false
    storage: [n8n environment, .env (local)]
    note: "WARNING: free model availability on OpenRouter is not guaranteed. Verify monthly at openrouter.ai/models. Change this var to hot-swap without code changes."

  # ── Evaluator Observability (ADR-012) ─────────────────────
  NOTION_EVAL_LOG_DB_ID:
    used_in: [n8n]
    description: "Notion database ID for the Evaluation Log (logs ALL LLM decisions)"
    format: "32-character hex string (from Notion page URL)"
    required: "Only when evaluation logging is enabled (P8)"
    secret: false
    storage: [n8n workflow, .env (local)]
    set_where: "Create 'Evaluation Log' DB in Notion → copy ID from URL"
    planned: true

  # ── Cloud Infrastructure (ADR-010) ────────────────────────
  N8N_DB_TYPE:
    used_in: [n8n docker]
    description: "Database type for n8n internal state (executions, credentials)"
    values: ["sqlite", "postgresdb"]
    default: "sqlite"
    required: false
    secret: false
    note: "Set to postgresdb on Oracle Cloud deployment (docker-compose.yml)"
    planned: true

  N8N_DB_POSTGRESDB_HOST:
    used_in: [n8n docker]
    description: "PostgreSQL host for n8n internal DB"
    default: "postgres"
    required: "Only when N8N_DB_TYPE=postgresdb"
    secret: false
    planned: true

  N8N_DB_POSTGRESDB_DATABASE:
    used_in: [n8n docker]
    description: "PostgreSQL database name"
    default: "n8n"
    required: "Only when N8N_DB_TYPE=postgresdb"
    secret: false
    planned: true

  N8N_DB_POSTGRESDB_USER:
    used_in: [n8n docker]
    description: "PostgreSQL user"
    default: "n8n"
    required: "Only when N8N_DB_TYPE=postgresdb"
    secret: true
    planned: true

  N8N_DB_POSTGRESDB_PASSWORD:
    used_in: [n8n docker]
    description: "PostgreSQL password"
    required: "Only when N8N_DB_TYPE=postgresdb"
    secret: true
    planned: true

github_secrets:
  # These must be set in GitHub repo Settings → Secrets → Actions
  required:
    - WEBHOOK_URL
  optional_for_full_pipeline:
    - NOTION_TOKEN
    - NOTION_DB_ID
    - TELEGRAM_BOT_TOKEN
    - TELEGRAM_CHAT_ID
  planned_additions:
    - LLM_API_KEY
    - OPENROUTER_API_KEY
    - NOTION_EVAL_LOG_DB_ID
  notes:
    - "WEBHOOK_URL is required for scraper CI -> webhook delivery."
    - "NOTION_TOKEN and NOTION_DB_ID are needed when n8n writes to Notion."
    - "TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are needed when n8n sends Telegram alerts."
    - "LLM_API_KEY is needed after P7 cloud migration (ADR-011)."
    - "NOTION_EVAL_LOG_DB_ID is needed after P8 evaluation logging (ADR-012)."
    - "Do not store these values in repo files; keep them only in GitHub Secrets / local env / n8n credentials."

# ============================================================
# SYNC RULE
# If new env var added → update this file + .env.example
# ============================================================
