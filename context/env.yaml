# ============================================================
# ENVIRONMENT VARIABLES MANIFEST
# All env vars used anywhere in the project.
# Update this file when: new env var added, usage changes.
# NEVER commit actual values — only metadata here.
# ============================================================

env_vars:
  WEBHOOK_URL:
    used_in: [scraper, github_actions]
    description: "n8n tunnel URL for the job ingest webhook"
    format: "https://{hash}.hooks.n8n.cloud/webhook/jobs/ingest"
    example: "https://abc123.hooks.n8n.cloud/webhook/jobs/ingest"
    required: true
    secret: true
    storage: [.env (local), GitHub Secrets (CI)]
    set_where: "n8n --tunnel output → copy to .env and GitHub Secret"

  NOTION_TOKEN:
    used_in: [n8n]
    description: "Notion Internal Integration Token"
    format: "secret_..."
    required: true
    secret: true
    storage: [n8n credentials, .env (local)]
    set_where: "notion.so/my-integrations → Create integration → copy token"

  NOTION_DB_ID:
    used_in: [n8n]
    description: "Notion database ID for AI Recruiter Board"
    format: "32-character hex string (from Notion page URL)"
    required: true
    secret: false
    storage: [n8n workflow, .env (local)]
    set_where: "Notion DB URL: notion.so/Name-{DATABASE_ID}?v=..."

  TELEGRAM_BOT_TOKEN:
    used_in: [n8n]
    description: "Telegram Bot API token for sending alerts"
    format: "{bot_id}:{hash}"
    required: true
    secret: true
    storage: [n8n credentials, .env (local)]
    set_where: "@BotFather on Telegram → /newbot → copy token"

  TELEGRAM_CHAT_ID:
    used_in: [n8n]
    description: "Telegram chat ID where alerts are sent"
    format: "negative integer for group, positive for DM"
    required: true
    secret: false
    storage: [n8n workflow, .env (local)]
    set_where: "Send message to bot → check getUpdates API response"

  OLLAMA_HOST:
    used_in: [n8n]
    description: "Base URL for Ollama API"
    default: "http://localhost:11434"
    required: false
    secret: false
    note: "Only change if Ollama runs on a different host"

  DRY_RUN:
    used_in: [scraper, github_actions]
    description: "Skip webhook POST — scrape but don't send"
    values: ["true", "false"]
    default: "false"
    required: false
    secret: false
    set_where: "workflow_dispatch input in GitHub Actions, or .env locally"

github_secrets:
  # These must be set in GitHub repo Settings → Secrets → Actions
  required:
    - WEBHOOK_URL
  not_needed_in_ci:
    - NOTION_TOKEN      # used only by n8n, not by the scraper
    - TELEGRAM_BOT_TOKEN  # used only by n8n
    - NOTION_DB_ID
    - TELEGRAM_CHAT_ID

# ============================================================
# SYNC RULE
# If new env var added → update this file + .env.example
# ============================================================
