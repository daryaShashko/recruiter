# ============================================================
# n8n MODULE MANIFEST
# Describes n8n workflows, Ollama config, Notion/Telegram mapping.
# Update when: workflow created/changed, prompt updated,
# new node added, Notion schema changes.
# ============================================================

module: n8n
path: n8n/
type: local_workflow_engine
run_command: "npx n8n start --tunnel"
api_base: "http://localhost:5678"
webhook_base: "https://{hash}.hooks.n8n.cloud"

workflows:
  ingest:
    file: n8n/workflows/ingest.json
    status: created
    phase: P2
    webhook_path: "/webhook/jobs/ingest"
    method: POST
    trigger: "scraper/src/sender.ts POST request"
    last_updated: "2026-05-28"
    architecture_note: >
      SINGLE MONOLITHIC WORKFLOW — contains the full pipeline end-to-end.
      No sub-workflows (evaluate.json and notify.json are deprecated/replaced).
      Flow: Webhook → Respond 200 → IF zero jobs → Normalize → Dedup Batch →
      SplitInBatches(1) → Switch(source) → HTTP:QueryNotion(dedup) →
      Code:CheckDuplicate → IF duplicate → Build Ollama Payload →
      Ask Ollama → Parse Ollama Response → LOG to Eval Log → IF Match? →
      (true: Notion Create Page → Telegram alert → loop back to Split)
      (false: NoOp Discard → loop back to Split).
      SplitInBatches loops until all items processed.
      Key: NoOp:Skip Duplicate and NoOp:Discard BOTH loop back to Split.
      Dedup is 3-level: within-batch fingerprint (Code:DedupBatch) +
      cross-batch HTTP query (fingerprint OR urlNorm OR url) +
      Code:CheckDuplicate parses Notion API response → isDuplicate boolean.
    nodes_sequence:
      - name: Webhook
        type: n8n-nodes-base.webhook
        config: "method: POST, path: jobs/ingest"
      - name: Respond to Webhook
        type: n8n-nodes-base.respondToWebhook
        config: "responseCode: 200, responseBody: {ok: true}"
        note: "MUST come BEFORE processing chain — avoids scraper timeout"
      - name: IF Zero jobs check
        type: n8n-nodes-base.if
        condition: "meta.count == 0 OR jobs.length == 0"
        on_true: "Telegram: Zero Jobs Alert (end)"
      - name: Normalize Jobs
        type: n8n-nodes-base.code
        language: JavaScript
        logic: >
          map $json.body.jobs → normalizeUrl (strip query params) →
          normalizeCompany (strip legal forms) → normalizeTitle (strip seniority) →
          fingerprint = FNV1a64(compNorm::titleNorm).hex16 →
          dedupFilter = {OR: [Fingerprint equals fp, URL equals urlNorm, URL equals url]}
        output_fields: "id, title, company, url, urlNorm, fingerprint, dedupFilter, body, source, location, salary, scrapedAt"
      - name: Code Dedup Batch
        type: n8n-nodes-base.code
        language: JavaScript
        logic: "within-batch dedup: Set(seenFingerprints) + Set(seenUrls). Filters duplicates before Split."
        note: "Level 1 dedup — prevents wasting Ollama compute on same-batch duplicates"
      - name: Split In Batches
        type: n8n-nodes-base.splitInBatches
        config: "batchSize: 1"
        note: "KEY: splitting happens HERE in ingest, NOT inside evaluate"
      - name: Switch Route by Source
        type: n8n-nodes-base.switch
        routes:
          0: justjoin → Notion Find Existing URL
          1: nofluffjobs → Notion Find Existing URL
          2: manual → Notion Find Existing URL
          3: fallback → Code Unknown Source → Notion Find Existing URL
        note: "All routes converge on the dedup check"
      - name: Notion Find Existing URL
        type: n8n-nodes-base.httpRequest
        note: "Level 2 dedup — POST /databases/{id}/query with dedupFilter OR conditions"
        config: "POST https://api.notion.com/v1/databases/36c747f7.../query, auth: notionApi predefined"
        body: "JSON.stringify($json.dedupFilter)"
      - name: Code Check Duplicate
        type: n8n-nodes-base.code
        logic: >
          resp.results.length > 0 → isDuplicate=true.
          Restores job data from Split In Batches: 1 context.
          Logs match reason (fingerprint / url / notion-match).
        output: "{...job, isDuplicate: boolean}"

  evaluate:
    file: n8n/workflows/evaluate.json
    status: deprecated
    deprecated_note: >
      evaluate.json is no longer used in production. The entire pipeline
      (dedup, LLM eval, Notion write, Telegram alert) was consolidated
      into ingest.json as a single flat workflow with SplitInBatches loop.
      This file is kept as a historical reference only. Do NOT modify.
    phase: P3
    last_updated: "2026-05-24"
    architecture_note: >
      Pure single-item sub-workflow. Receives exactly 1 JobOffer item from ingest.
      No Split In Batches inside (was removed — caused NOOP:DONE bug).
      No loopbacks. Linear flow with two exit branches.
      Dedup happens HERE (pre-LLM) — single source of truth for deduplication.
    nodes_sequence:
      - name: Execute Workflow Trigger
        type: n8n-nodes-base.executeWorkflowTrigger
        note: "Receives 1 item from ingest via Call 'Evaluate Jobs (Ollama)'"
      - name: Notion Find Existing URL
        type: n8n-nodes-base.notion
        operation: "getAll (filter: URL equals $json.url, limit: 1)"
        note: "Pre-LLM dedup — avoids wasting Ollama compute on known URLs"
      - name: IF Already in Notion
        type: n8n-nodes-base.if
        condition: "!!$json.id === true  (Notion returned a record)"
        on_true: "NoOp: Skip Duplicate (end)"
        on_false: "Code: Build Ollama Payload"
      - name: Build Ollama Payload
        type: n8n-nodes-base.code
        config: "builds systemPrompt (from candidate_profile.md) + userMessage from job fields"
        note: "P12-6: renamed conceptually to Build LLM Payload; node name unchanged for ref compatibility.
               No ollamaBody, no assistant prefill. Returns { ...job, systemPrompt, userMessage }."
      - name: Code: LLM Router
        type: n8n-nodes-base.code
        phase: P12-6
        config: >-
          Reads $env.LLM_PROVIDER (default: ollama) and dispatches to inline adapter:
          ollama → POST {LLM_BASE_URL}/api/chat (timeout 300s, format=outputSchema);
          gemini → POST generateContent?key= (timeout 60s, responseSchema);
          anthropic → POST /v1/messages with tool_use (timeout 60s).
          Returns { message: { content: rawString } } — compatible with Parse Ollama Response.
        on_error: "Continue (using error output)"
        replaces: "HTTP Request: Ask Ollama"
      - name: Parse Ollama Response
        type: n8n-nodes-base.code
        logic: "strip markdown fences, JSON.parse, validate match:boolean, fallback to match=false"
      - name: IF Match
        type: n8n-nodes-base.if
        condition: "$json.match === true"
        on_true: "Call 'Notify'"
        on_false: "NoOp: Discard Non-Match (end)"

  notify:
    file: n8n/workflows/notify.json
    status: created
    phase: P4
    last_updated: "2026-05-24"
    architecture_note: >
      Pure notification sub-workflow. Called only for match=true items.
      No dedup here — dedup is exclusively in evaluate (pre-LLM).
      Sequential: Notion Create → Telegram (ensures page exists before alert).
    nodes_sequence:
      - name: When Executed by Another Workflow
        type: n8n-nodes-base.executeWorkflowTrigger
        note: "Receives 1 matched JobOffer item from evaluate"
      - name: Notion Create Page
        type: n8n-nodes-base.notion
        operation: create
        database: AI Recruiter Board
        fields:
          [
            Name,
            Company,
            URL,
            Source,
            Match Reason,
            Salary,
            Status=New,
            Location,
            Scraped At,
          ]
      - name: Telegram Send Alert
        type: n8n-nodes-base.telegram
        note: "Fires after Notion create (sequential, not parallel)"

  telegram_trigger:
    file: n8n/workflows/telegram-trigger.json
    status: not_created # Phase P14 — planned P5, deferred, now formally scoped
    phase: P14
    adr: ADR-018
    nodes_sequence:
      - name: Telegram Trigger
        type: n8n-nodes-base.telegramTrigger
        config: "listens for messages matching /check <url>"
      - name: Parse Command
        type: n8n-nodes-base.code
        logic: "extract URL from '/check https://...' message"
      - name: Fetch Job Page
        type: n8n-nodes-base.httpRequest
        note: "GET request to corporate URL; returns HTML body"
      - name: Strip HTML to Plain Text
        type: n8n-nodes-base.code
        logic: "strip HTML tags → plain text; detect SPA (charCount < 500)"
        output: "{ rawText, charCount, fetchError, spaDetected }"
      - name: LLM Extract Job Fields
        type: n8n-nodes-base.httpRequest
        note: "POST to Ollama/Gemini with extract-job-fields prompt; returns structured JSON"
      - name: Parse Extraction Result
        type: n8n-nodes-base.code
        logic: "strip markdown fences, JSON.parse, safe fallback on failure"
      - name: POST to ingest webhook
        type: n8n-nodes-base.httpRequest
        note: "POST WebhookPayload to /webhook/jobs/ingest with source='manual'; reuses full pipeline"
      - name: Telegram Reply
        type: n8n-nodes-base.telegram
        note: "Confirm result or report error to user in same chat"

ollama:
  endpoint: "http://localhost:11434/api/chat"
  model: "llama3.1:8b"
  note: "P12-6: LLM is now provider-agnostic via Code: LLM Router. Ollama remains default."
  env_vars:
    LLM_PROVIDER: "ollama | gemini | anthropic (default: ollama)"
    LLM_API_KEY:  "API key for Gemini/Anthropic (default: empty)"
    LLM_MODEL:    "model name (default: provider-specific)"
    LLM_BASE_URL: "Ollama base URL (default: http://localhost:11434)"
    setup_note:   "Set via n8n Settings → Variables (NOT host .env file)"
  request_template:
    model: "llama3.1:8b"
    stream: false
    keep_alive: 0 # MANDATORY — prevents VRAM leak between requests
    messages:
      - role: system
        content: "see n8n/prompts/evaluator.md"
      - role: user
        content: |
          Job Title: {{ $json.title }}
          Company: {{ $json.company }}
          Location: {{ $json.location }}
          Salary: {{ $json.salary }}
          URL: {{ $json.url }}

          Job Description:
          {{ $json.body || $json.jobText || $json.description || 'No description available' }}
  response_parsing:
    path: "response.message.content"
    expected: "JSON string: { match: boolean, reason: string, url: string }"
    parse_in: "n8n Code node with try/catch"
    fallback_on_error: "{ match: false, reason: 'Parse error: ...', url: $json.url }"

evaluator_prompt:
  file: n8n/prompts/evaluator.md
  template_file: n8n/prompts/evaluator-template.json
  status: written
  last_updated: "2026-05-29"
  eval_results: "21/22 (95.45%) — promptfoo gold dataset, gemini-3.1-flash-lite"
  model_notes:
    - "llama3.1:8b responds well to explicit role-playing ('You are an expert IT recruiter')"
    - "CRITICAL: model must return raw JSON — explicitly prohibit markdown fences in prompt"
    - "Rule 5 revised: Node.js-only backend → score 60-75 (Review), NOT rejected"
    - "Node.js as PRIMARY (80%+) in mixed stack → score >= 80 if all other criteria match"
    - "Outsourcing rule: only flag with explicit evidence, not by company name assumption"
    - "Missing body: evaluate on title + salary only; do NOT infer company type"
    - "reason field MUST contain specific concrete detail (tech name, salary, location)"
    - "keep_alive: 0 on every request is mandatory"

notion_field_mapping:
  Title: "{{ $json.title }}"
  Company: "{{ $json.company }}"
  URL: "{{ $json.url }}"
  Fingerprint: "{{ $json.fingerprint }}" # FNV1a64 hash — primary dedup key
  Source: "{{ $json.source }}"
  Match_Reason: "{{ $json.reason }}"
  Salary: "{{ $json.salary }}"
  Status: "New"
  Location: "{{ $json.location }}"
  Scraped_At: "{{ $json.scrapedAt }}"
  dedup_key: Fingerprint # primary; URL (norm + original) as fallback for old records
  dedup_strategy: "3-level: batch fingerprint → Notion API OR query → isDuplicate flag"

telegram_alert_format: |
  🟢 *{{ $json.title }}* @ {{ $json.company }}
  💰 {{ $json.salary || 'No salary info' }}
  📍 {{ $json.source }} | {{ $json.location }}
  🔗 {{ $json.url }}

  _{{ $json.reason }}_

error_workflow:
  trigger: "Error Trigger node (separate workflow)"
  action: "Send Telegram message"
  format: "❌ Workflow failed: {{ $workflow.name }} — {{ $json.message }}"
  note: "Add to every workflow in n8n"

# ============================================================
# SYNC RULE
# Update this file when:
# - New n8n workflow created → update status to 'created'
# - Ollama model changed → update model field
# - Evaluator prompt changed → note it here
# - Notion schema changes → update field_mapping
# ============================================================
