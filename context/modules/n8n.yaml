# ============================================================
# n8n MODULE MANIFEST
# Describes n8n workflows, Ollama config, Notion/Telegram mapping.
# Update when: workflow created/changed, prompt updated,
# new node added, Notion schema changes.
# ============================================================

module: n8n
path: n8n/
type: local_workflow_engine
run_command: "npx n8n start --tunnel"
api_base: "http://localhost:5678"
webhook_base: "https://{hash}.hooks.n8n.cloud"

workflows:
  ingest:
    file: n8n/workflows/ingest.json
    status: created
    phase: P2
    webhook_path: "/webhook/jobs/ingest"
    method: POST
    trigger: "scraper/src/sender.ts POST request"
    last_updated: "2026-05-24"
    architecture_note: >
      SINGLE MONOLITHIC WORKFLOW — contains the full pipeline end-to-end.
      No sub-workflows (evaluate.json and notify.json are deprecated/replaced).
      Flow: Webhook → Respond 200 → IF zero jobs → Normalize → SplitInBatches(1) →
      Switch(source) → Notion dedup → IF duplicate → Build Ollama Payload →
      Ask Ollama → Parse Ollama Response → [LOG to Eval Log — P8] → IF Match? →
      (true: Notion Create Page → Telegram alert → loop back to Split)
      (false: NoOp Discard → loop back to Split).
      SplitInBatches loops until all items processed.
      Key: NoOp:Skip Duplicate and NoOp:Discard BOTH loop back to Split.
    nodes_sequence:
      - name: Webhook
        type: n8n-nodes-base.webhook
        config: "method: POST, path: jobs/ingest"
      - name: Respond to Webhook
        type: n8n-nodes-base.respondToWebhook
        config: "responseCode: 200, responseBody: {ok: true}"
        note: "MUST come BEFORE processing chain — avoids scraper timeout"
      - name: IF Zero jobs check
        type: n8n-nodes-base.if
        condition: "meta.count == 0 OR jobs.length == 0"
        on_true: "Telegram: Zero Jobs Alert (end)"
      - name: Normalize Jobs
        type: n8n-nodes-base.code
        language: JavaScript
        logic: "map $json.body.jobs → ensure all JobOffer fields present"
      - name: Split In Batches
        type: n8n-nodes-base.splitInBatches
        config: "batchSize: 1"
        note: "KEY: splitting happens HERE in ingest, NOT inside evaluate"
      - name: Switch Route by Source
        type: n8n-nodes-base.switch
        routes:
          0: justjoin → Call 'Evaluate Jobs (Ollama)'
          1: nofluffjobs → Call 'Evaluate Jobs (Ollama)'
          2: manual → Call 'Evaluate Jobs (Ollama)'
          3: fallback → Code Unknown Source → Call 'Evaluate Jobs (Ollama)'
        note: "Extensible: add new source → new output → new evaluate sub-workflow"
      - name: Call Evaluate Jobs Ollama
        type: n8n-nodes-base.executeWorkflow
        target_workflow: evaluate.json
        config: "waitForSubWorkflow: true"
        loopback: "output → Split In Batches (continues loop)"

  evaluate:
    file: n8n/workflows/evaluate.json
    status: deprecated
    deprecated_note: >
      evaluate.json is no longer used in production. The entire pipeline
      (dedup, LLM eval, Notion write, Telegram alert) was consolidated
      into ingest.json as a single flat workflow with SplitInBatches loop.
      This file is kept as a historical reference only. Do NOT modify.
    phase: P3
    last_updated: "2026-05-24"
    architecture_note: >
      Pure single-item sub-workflow. Receives exactly 1 JobOffer item from ingest.
      No Split In Batches inside (was removed — caused NOOP:DONE bug).
      No loopbacks. Linear flow with two exit branches.
      Dedup happens HERE (pre-LLM) — single source of truth for deduplication.
    nodes_sequence:
      - name: Execute Workflow Trigger
        type: n8n-nodes-base.executeWorkflowTrigger
        note: "Receives 1 item from ingest via Call 'Evaluate Jobs (Ollama)'"
      - name: Notion Find Existing URL
        type: n8n-nodes-base.notion
        operation: "getAll (filter: URL equals $json.url, limit: 1)"
        note: "Pre-LLM dedup — avoids wasting Ollama compute on known URLs"
      - name: IF Already in Notion
        type: n8n-nodes-base.if
        condition: "!!$json.id === true  (Notion returned a record)"
        on_true: "NoOp: Skip Duplicate (end)"
        on_false: "Code: Build Ollama Payload"
      - name: Build Ollama Payload
        type: n8n-nodes-base.code
        config: "builds ollamaBody with system prompt inline + job fields"
      - name: Ask Ollama
        type: n8n-nodes-base.httpRequest
        config:
          method: POST
          url: "http://127.0.0.1:11434/api/chat"
          timeout: 300000
          on_error: "Continue (using error output)"
      - name: Parse Ollama Response
        type: n8n-nodes-base.code
        logic: "strip markdown fences, JSON.parse, validate match:boolean, fallback to match=false"
      - name: IF Match
        type: n8n-nodes-base.if
        condition: "$json.match === true"
        on_true: "Call 'Notify'"
        on_false: "NoOp: Discard Non-Match (end)"

  notify:
    file: n8n/workflows/notify.json
    status: created
    phase: P4
    last_updated: "2026-05-24"
    architecture_note: >
      Pure notification sub-workflow. Called only for match=true items.
      No dedup here — dedup is exclusively in evaluate (pre-LLM).
      Sequential: Notion Create → Telegram (ensures page exists before alert).
    nodes_sequence:
      - name: When Executed by Another Workflow
        type: n8n-nodes-base.executeWorkflowTrigger
        note: "Receives 1 matched JobOffer item from evaluate"
      - name: Notion Create Page
        type: n8n-nodes-base.notion
        operation: create
        database: AI Recruiter Board
        fields:
          [
            Name,
            Company,
            URL,
            Source,
            Match Reason,
            Salary,
            Status=New,
            Location,
            Scraped At,
          ]
      - name: Telegram Send Alert
        type: n8n-nodes-base.telegram
        note: "Fires after Notion create (sequential, not parallel)"

  telegram_trigger:
    file: n8n/workflows/telegram-trigger.json
    status: not_created # Phase P5
    phase: P5
    nodes_sequence:
      - name: Telegram Trigger
        type: n8n-nodes-base.telegramTrigger
      - name: Parse Command
        type: n8n-nodes-base.code
        logic: "extract URL from '/check https://...' command"
      - name: Fetch Job Page
        type: n8n-nodes-base.httpRequest
        note: "Fetch HTML, extract text, pass to evaluate flow"
      - name: "(reuses evaluate + notion flow)"

ollama:
  endpoint: "http://localhost:11434/api/chat"
  model: "llama3.1:8b"
  request_template:
    model: "llama3.1:8b"
    stream: false
    keep_alive: 0 # MANDATORY — prevents VRAM leak between requests
    messages:
      - role: system
        content: "see n8n/prompts/evaluator.md"
      - role: user
        content: |
          Job Title: {{ $json.title }}
          Company: {{ $json.company }}
          Location: {{ $json.location }}
          Salary: {{ $json.salary }}
          URL: {{ $json.url }}

          Job Description:
          {{ $json.body || $json.jobText || $json.description || 'No description available' }}
  response_parsing:
    path: "response.message.content"
    expected: "JSON string: { match: boolean, reason: string, url: string }"
    parse_in: "n8n Code node with try/catch"
    fallback_on_error: "{ match: false, reason: 'Parse error: ...', url: $json.url }"

evaluator_prompt:
  file: n8n/prompts/evaluator.md
  status: written
  model_notes:
    - "llama3.1:8b responds well to explicit role-playing ('You are an expert IT recruiter')"
    - "Must include 'respond ONLY with valid JSON' — model tends to add explanation"
    - "Body truncation to ~1500 chars recommended (8k context window)"
    - "keep_alive: 0 on every request is mandatory"

notion_field_mapping:
  Title: "{{ $json.title }}"
  Company: "{{ $json.company }}"
  URL: "{{ $json.url }}"
  Source: "{{ $json.source }}"
  Match_Reason: "{{ $json.reason }}"
  Salary: "{{ $json.salary }}"
  Status: "New"
  Location: "{{ $json.location }}"
  Scraped_At: "{{ $json.scrapedAt }}"
  dedup_key: URL # Notion is queried by URL before insert

telegram_alert_format: |
  🟢 *{{ $json.title }}* @ {{ $json.company }}
  💰 {{ $json.salary || 'No salary info' }}
  📍 {{ $json.source }} | {{ $json.location }}
  🔗 {{ $json.url }}

  _{{ $json.reason }}_

error_workflow:
  trigger: "Error Trigger node (separate workflow)"
  action: "Send Telegram message"
  format: "❌ Workflow failed: {{ $workflow.name }} — {{ $json.message }}"
  note: "Add to every workflow in n8n"

# ============================================================
# SYNC RULE
# Update this file when:
# - New n8n workflow created → update status to 'created'
# - Ollama model changed → update model field
# - Evaluator prompt changed → note it here
# - Notion schema changes → update field_mapping
# ============================================================
