# ============================================================
# SCRAPER MODULE MANIFEST
# Describes scraper/ directory: exports, patterns, status, gaps.
# Update when: new scraper added, interfaces change,
# new patterns established, known gaps resolved.
# ============================================================

module: scraper
path: scraper/
language: TypeScript 5.5
runtime: Node.js 20
entry_point: src/index.ts
scripts:
  build: "tsc → dist/"
  run: "ts-node src/index.ts"
  test: "jest --testEnvironment=node --timeout=60000"
  typecheck: "tsc --noEmit"

dependencies:
  playwright: "^1.45.0"
  axios: "^1.7.2"
  dotenv: "^16.4.5"
  typescript: "^5.5.3"
  ts-node: "^10.9.2"
  jest: "^29.7.0"
  ts-jest: "^29.2.2"

files:
  src/config.ts:
    exports: [config, validateConfig]
    key_values:
      webhookUrl: "from WEBHOOK_URL env var"
      scraper.locations: ["gdansk", "gdańsk", "remote", "zdalnie"]
      scraper.targetStack:
        ["javascript", "typescript", "node", "react", "postgresql", "postgres"]
      scraper.rejectStack:
        ["java", "c#", ".net", "php", "ruby", "go", "rust", "kotlin", "swift"]
      scraper.targetLevels:
        ["senior", "lead", "principal", "architect", "staff"]
      scraper.rejectLevels: ["junior", "mid", "regular", "intern", "trainee"]
      playwright.headless: true
      playwright.viewport: "1440x900"
      playwright.userAgent: "Chrome 126 macOS"
      playwright.navigationTimeout: 30000
      playwright.requestTimeout: 15000
      sender.maxRetries: 3
      sender.retryDelay: 1000 # doubles each attempt (exponential backoff)

  src/types.ts:
    exports: [JobOffer, WebhookPayload, EvaluationResult]
    note: "See context/interfaces.yaml for full field definitions"

  src/index.ts:
    exports: [] # side-effect entry point
    pattern: "Promise.allSettled([scrapeJustJoin(), scrapeNoFluffJobs()])"
    dedup: "deduplicateOffers() — by id using Set<string>"
    error_handling: "each scraper failure is logged, others continue"
    exit_codes:
      0: "success"
      1: "config validation failed OR webhook send failed"

  src/sender.ts:
    exports: [sendToWebhook]
    signature: "(jobs: JobOffer[], source: string) => Promise<void>"
    payload_shape: "WebhookPayload { jobs, meta: { source, count, sentAt } }"
    retry: "3 attempts, exponential backoff starting at 1000ms"
    timeout: "15000ms per request"
    throws: "Error if all retries exhausted"

  src/scrapers/justjoin.ts:
    exports: [scrapeJustJoin]
    signature: "() => Promise<JobOffer[]>"
    base_url: "https://justjoin.it"
    api_endpoint: "https://justjoin.it/api/candidate-api/offers" # verified via DevTools 2025-05
    method: "GET (intercepted via page.on('response'))"
    navigation_url: "https://justjoin.it/job-offers/all-locations/javascript?orderBy=descending&sortBy=publishedAt"
    response_path: "json.data"
    id_format: "justjoin_{raw.slug}"
    status: implemented
    salary_source: "employmentTypes[] — prefer currency=PLN + currencySource=original + type=b2b + unit=Month"
    location_logic: "workplaceType=remote → 'Remote'; locations[].city contains Gdańsk → 'Gdańsk'; else primary city"
    body_strategy: "buildBody() — synthetic from title + experienceLevel + requiredSkills + niceToHaveSkills + locations"
    pre_filter: "matchesPreFilter() — drops non-remote/non-Gdańsk AND rejectLevels (junior/mid/intern)"
    known_gaps:
      - "No body text in list API — Ollama evaluates from structured fields only"
      - "Pagination not implemented — only first batch (~100 offers) is captured"
    never_throws: true # catches internally, returns [] on failure

  src/scrapers/nofluffjobs.ts:
    exports: [scrapeNoFluffJobs]
    signature: "() => Promise<JobOffer[]>"
    base_url: "https://nofluffjobs.com"
    api_endpoint: "https://nofluffjobs.com/api/search/posting" # verified via DevTools 2025-05
    method: "POST (intercepted via page.on('response') for page 1; page.evaluate fetch for pages 2+)"
    navigation_url: "https://nofluffjobs.com/pl/praca/javascript"
    response_path: "json.postings" # confirmed — top-level key in API response
    id_format: "nofluffjobs_{raw.reference}" # reference is stable across location variants; raw.id is NOT unique
    status: implemented
    pagination:
      mechanism: "page 1 via XHR intercept; pages 2..totalPages via page.evaluate fetch (reuses browser session/cookies)"
      page_param: "body.page (integer, 1-based)"
      total_pages_field: "json.totalPages"
      safety_cap: 50
      inter_page_delay_ms: 300
    api_response_shape: # verified via DevTools 2025-05
      totalPages: number
      totalCount: number # includes all location variants of each job
      divs: number # unique job postings count (before location expansion); use this for expected batch size
      postings: RawNoFluffPosting[]
      rawSearch: string
      criteriaSearch: object
      salaryMatchBlock: object
    salary_logic: "extractSalary() — requires disclosedAt=VISIBLE; returns 'from–to CURRENCY TYPE/mo'"
    location_logic: "location.fullyRemote → 'Remote'; places[].city contains Gdańsk → 'Gdańsk'; else first non-provinceOnly city"
    body_strategy: "buildBody() — synthetic from title + company + category + seniority + technology + tags + locations"
    pre_filter: "matchesPreFilter() — drops non-remote/non-Gdańsk AND rejectLevels (junior/mid/intern)"
    dedup: "deduplicateByReference() — same job appears once per location; keeps remote > Gdańsk > first seen"
    known_gaps:
      - "No full job description in list API — LLM evaluates from structured fields only"
    never_throws: true # catches internally, returns [] on failure

  src/utils/browser.ts:
    exports: [openPage, closeBrowser]
    openPage_returns: "{ page: Page, context: BrowserContext }"
    fingerprint:
      userAgent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) Chrome/126"
      viewport: "1440x900"
      headless: true
    note: "Always close context in finally block after scraping"

playwright_contract:
  method: "XHR interception — page.on('response', handler)"
  never_use: "DOM selectors (page.$, page.locator)"
  never_use_reason: "Cloudflare blocks headless patterns; DOM breaks on UI changes"
  wait_strategy: "page.goto(url, { waitUntil: 'networkidle' }) + waitForTimeout(3000)"
  lifecycle: "openPage() in scraper → context.close() in finally"

scraper_output_contract:
  - "Each scraper function returns Promise<JobOffer[]>"
  - "On any error: log to console, return [] (never throw)"
  - "id prefix must match source: 'justjoin_...' or 'nofluffjobs_...'"
  - "scrapedAt is ISO string set at normalization time"
  - "All string fields are non-null (use fallbacks)"

output:
  format: WebhookPayload
  destination: "WEBHOOK_URL env var (via sender.ts)"
  artifact_path: "scraper/output/ (uploaded by GitHub Actions)"

# ============================================================
# SYNC RULE
# Update this file when:
# - New scraper added (new file entry)
# - known_gaps resolved (change status)
# - config.ts values change
# - scraper contract changes (output shape, error handling)
# ============================================================
