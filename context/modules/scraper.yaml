# ============================================================
# SCRAPER MODULE MANIFEST
# Describes scraper/ directory: exports, patterns, status, gaps.
# Update when: new scraper added, interfaces change,
# new patterns established, known gaps resolved.
# ============================================================

module: scraper
path: scraper/
language: TypeScript 5.5
runtime: Node.js 20
entry_point: src/index.ts
scripts:
  build: "tsc → dist/"
  run: "ts-node src/index.ts"
  test: "jest --testEnvironment=node --timeout=60000"
  typecheck: "tsc --noEmit"

dependencies:
  playwright: "^1.45.0"
  axios: "^1.7.2"
  dotenv: "^16.4.5"
  typescript: "^5.5.3"
  ts-node: "^10.9.2"
  jest: "^29.7.0"
  ts-jest: "^29.2.2"

files:
  src/config.ts:
    exports: [config, validateConfig]
    key_values:
      webhookUrl: "from WEBHOOK_URL env var"
      webhookUrl_validation: "required, absolute http/https URL"
      scraper.locations: ["gdansk", "gdańsk", "remote", "zdalnie"]
      scraper.targetStack:
        ["javascript", "typescript", "node", "react", "postgresql", "postgres"]
      scraper.rejectStack:
        ["java", "c#", ".net", "php", "ruby", "go", "rust", "kotlin", "swift"]
      scraper.targetLevels:
        ["senior", "lead", "principal", "architect", "staff"]
      scraper.rejectLevels: ["junior", "mid", "regular", "intern", "trainee"]
      playwright.headless: true
      playwright.viewport: "1440x900"
      playwright.userAgent: "Chrome 126 macOS"
      playwright.navigationTimeout: 30000
      playwright.requestTimeout: 15000
      sender.maxRetries: 3
      sender.retryDelay: 1000 # doubles each attempt (exponential backoff)
      sender.batchSize: 25 # override via WEBHOOK_BATCH_SIZE

  src/types.ts:
    exports: [JobOffer, WebhookPayload, EvaluationResult]
    note: "See context/interfaces.yaml for full field definitions"

  src/index.ts:
    exports: [] # side-effect entry point
    pattern: "Promise.allSettled([scrapeJustJoin(), scrapeNoFluffJobs()])"
    dedup: "deduplicateOffers() — by id using Set<string>"
    error_handling: "each scraper failure is logged, others continue"
    exit_codes:
      0: "success"
      1: "config validation failed OR webhook send failed"

  src/sender.ts:
    exports: [sendToWebhook]
    signature: "(jobs: JobOffer[], source: string) => Promise<void>"
    payload_shape: "WebhookPayload { jobs, meta: { source, count, sentAt } }"
    batching: "splits jobs into chunks (default 25) and sends sequentially"
    retry: "3 attempts, exponential backoff starting at 1000ms (network/5xx); fail-fast on 4xx config/auth/path errors"
    timeout: "15000ms per request"
    throws: "Error on non-retriable 4xx or if retriable attempts are exhausted"

  src/scrapers/justjoin.ts:
    exports: [scrapeJustJoin]
    signature: "() => Promise<JobOffer[]>"
    base_url: "https://justjoin.it"
    api_endpoint: "https://justjoin.it/api/candidate-api/offers" # verified via DevTools 2025-05
    method: >
      Direct axios GET — no browser (ADR-019, 2026-10). Re-verified reachable
      from a GitHub Actions runner (no Cloudflare 403 for this endpoint anymore).
    response_path: "response.data.data"
    id_format: "justjoin_{raw.slug}"
    status: implemented
    salary_source: "employmentTypes[] — prefer currency=PLN + currencySource=original + type=b2b + unit=Month"
    location_logic: "workplaceType=remote → 'Remote'; locations[].city contains Gdańsk → 'Gdańsk'; else primary city"
    body_strategy: "buildBody() — synthetic from title + experienceLevel + requiredSkills + niceToHaveSkills + locations"
    pre_filter: "matchesPreFilter() — drops non-remote/non-Gdańsk AND rejectLevels (junior/mid/intern)"
    pagination:
      mechanism: "fetchOffersPage(from) via axios; from=0,100,200,... with a 300ms delay between requests"
      page_size: 100
      safety_cap: 30
    known_gaps:
      - "No body text in list API — Ollama evaluates from structured fields only"
      - "Direct API query params may require refresh if JustJoin API contract changes"
    never_throws: true # catches internally, returns [] on failure

  src/scrapers/nofluffjobs.ts:
    exports: [scrapeNoFluffJobs]
    signature: "() => Promise<JobOffer[]>"
    base_url: "https://nofluffjobs.com"
    method: >
      Direct axios POST — no browser (ADR-019, 2026-10). Calls the same
      /api/search/posting endpoint the site's own "Pokaż kolejne oferty"
      (load more) button uses, captured via DevTools.
      SUPERSEDED: the 2026-05 "Angular SSR, cumulative ?page=N" approach
      documented below no longer works — ?page=N echoes back in the response
      but the embedded postings never change, and the real last page returns
      a null searchResponse. Re-verified with an actual browser, not just HTTP —
      this was a site-side contract change, not a Playwright-vs-HTTP issue.
    api_endpoint: "https://nofluffjobs.com/api/search/posting"
    request_shape:
      method: POST
      query_params: "withSalaryMatch=true, pageTo=N (1-based), pageSize=20, salaryCurrency=original, salaryPeriod=original, region=pl, language=pl-PL"
      body: '{ criteria: "", url: { searchParam: "praca", searchParam2: "javascript" }, rawSearch: "praca javascript", pageSize: 20, withSalaryMatch: true }'
      critical_header: >
        Content-Type: application/infiniteSearch+json — load-bearing. A plain
        "application/json" on the identical request makes the server silently
        re-send the full first-page snapshot (duplicated) on every pageTo
        instead of the next batch. No cookies/session/nfj-global-context
        header required.
    response_path: >
      response.data.postings when non-empty, else
      response.data.additionalSearch[0].postings (used when the site segments
      results by its "Salary Match" feature). See extractPostingsBatch().
    id_format: "nofluffjobs_{raw.reference}" # reference is stable across location variants
    status: implemented
    pagination:
      mechanism: >
        Loop pageTo=1..totalPages (from the pageTo=1 response), one POST per
        page, with a 500ms delay between calls — removing the delay was
        observed to make the server fall back to the full-snapshot behavior
        above instead of real pagination.
      page_size: 20
      safety_cap: 20
      coverage: "~104/108 (~96%) unique postings per run as of 2026-10-05; not 100% (not investigated further)"
    salary_logic: "extractSalary() — requires disclosedAt=VISIBLE; returns 'from–to CURRENCY TYPE/mo'"
    location_logic: "location.fullyRemote → 'Remote'; places[].city contains Gdańsk → 'Gdańsk'; else first non-provinceOnly city"
    body_strategy: "buildBody() — synthetic from title + company + category + seniority + technology + tags + locations"
    pre_filter: "matchesPreFilter() — drops non-remote/non-Gdańsk AND rejectLevels (junior/mid/intern)"
    dedup: "deduplicateByReference() — same job appears once per location; keeps remote > Gdańsk > first seen"
    known_gaps:
      - "No full job description in list API — LLM evaluates from structured fields only"
      - "/api/search/posting is undocumented/unversioned — may break again on NFJ frontend changes"
      - "robots.txt disallows /api/ on nofluffjobs.com — already effectively hit via Playwright XHR interception pre-2026-05, not a new policy stance, but worth tracking (see ADR-019)"
    never_throws: true # catches internally, returns [] on failure

  src/debug-urls.ts:
    exports: [] # debug script, not imported elsewhere
    purpose: "Log all non-static network URLs from both sites. Re-run when site structure suspected to have changed."
    run: "npx ts-node src/debug-urls.ts"
    note: "DELETE or keep; not part of production pipeline"

  src/utils/browser.ts:
    exports: [openPage, closeBrowser]
    openPage_returns: "{ page: Page, context: BrowserContext }"
    fingerprint:
      userAgent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) Chrome/126"
      viewport: "1440x900"
      headless: true
    note: "Always close context in finally block after scraping"

playwright_contract:
  scope: >
    No longer used by justjoin.ts or nofluffjobs.ts (ADR-019, 2026-10 — both call
    their APIs directly via axios). Still used by src/check-manual.ts (manual job
    submission from an arbitrary URL — genuinely needs a real browser) and the
    debug scripts src/debug-urls.ts / src/scrape-one.ts.
  method: "XHR interception — page.on('response', handler)"
  never_use: "DOM selectors (page.$, page.locator)"
  never_use_reason: "Cloudflare blocks headless patterns; DOM breaks on UI changes"
  wait_strategy: "page.goto(url, { waitUntil: 'networkidle' }) + waitForTimeout(3000)"
  lifecycle: "openPage() in scraper → context.close() in finally"

scraper_output_contract:
  - "Each scraper function returns Promise<JobOffer[]>"
  - "On any error: log to console, return [] (never throw)"
  - "id prefix must match source: 'justjoin_...' or 'nofluffjobs_...'"
  - "scrapedAt is ISO string set at normalization time"
  - "All string fields are non-null (use fallbacks)"

output:
  format: WebhookPayload
  destination: "WEBHOOK_URL env var (via sender.ts)"
  artifact_path: "output/ (ROOT of repo — index.ts writes to ../../output relative to src/)"

