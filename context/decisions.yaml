# ============================================================
# ARCHITECTURE DECISIONS RECORD (ADR) LOG
# Captures all significant architecture decisions.
# Update this file when: new design decision made,
# existing decision revisited or reversed.
# ============================================================

decisions:
  ADR-001:
    title: "XHR interception instead of DOM parsing"
    status: "accepted; partially superseded by ADR-019 (2026-10) for justjoin.ts and
      nofluffjobs.ts — the Cloudflare block this ADR worked around no longer reproduces
      for those two endpoints. Still in effect for check-manual.ts, which launches a
      real browser."
    date: "2024-07"
    context: >
      Job boards (JustJoin.it, NoFluffJobs) use Cloudflare WAF.
      Direct HTTP requests return 403. DOM selectors break on every UI redesign.
    decision: "Use Playwright page.on('response') to intercept internal XHR/Fetch API calls"
    rationale:
      - "Cloudflare doesn't block a real browser with fingerprints"
      - "XHR responses are clean JSON — no parsing needed"
      - "Resilient to frontend UI changes as long as the API contract holds"
    consequences:
      positive:
        - "No Cloudflare 403"
        - "Clean structured JSON output"
        - "Resilient to UI redesigns"
      negative:
        - "API endpoint must be discovered manually via DevTools"
        - "Endpoint URL may change silently — need monitoring"
        - "Requires full browser launch (slower, more memory)"
    implementation: "scraper/src/scrapers/*.ts — page.on('response', handler)"

  ADR-002:
    title: "Local Ollama instead of cloud LLM API"
    status: accepted
    date: "2024-07"
    context: >
      Need LLM evaluation of job descriptions.
      Cloud APIs (OpenAI, Anthropic) have rate limits, costs, and privacy concerns.
    decision: "Use locally hosted Ollama with llama3.1:8b model"
    rationale:
      - "No rate limits — evaluate as many jobs as needed"
      - "Zero API cost"
      - "Job descriptions are private/sensitive data"
      - "keep_alive: 0 prevents VRAM leak between requests"
    consequences:
      positive:
        - "Unlimited requests"
        - "No cost"
        - "Data privacy"
      negative:
        - "Requires local machine with sufficient RAM/GPU"
        - "n8n and Ollama must run on the same machine"
        - "Model quality lower than GPT-4 — prompt must be very explicit"
        - "Cold start time if keep_alive: 0 is set"
    implementation: "n8n/prompts/evaluator.md + n8n evaluate.json HTTP Request node"

  ADR-003:
    title: "Notion as primary job storage and Kanban board"
    status: accepted
    date: "2024-07"
    context: >
      Need persistent storage for matched jobs + a UI for manual review workflow.
      Setting up a separate database (Postgres, etc.) adds infra complexity.
    decision: "Use Notion API as the job offer database"
    rationale:
      - "Zero infrastructure — no database to maintain"
      - "Built-in Kanban view for manual review"
      - "URL-based deduplication works via Notion Query API"
      - "Free tier sufficient for personal use"
    consequences:
      positive:
        - "No extra infra"
        - "Built-in UI + mobile app"
        - "API dedup query is reliable"
      negative:
        - "Notion API rate limit: 3 requests/second"
        - "Not suitable for analytics or bulk queries"
        - "Schema changes require manual Notion DB updates"
    implementation: "n8n notion.json workflow + docs/notion-schema.md"

  ADR-004:
    title: "Webhook responds immediately, processes asynchronously"
    status: accepted
    date: "2024-07"
    context: >
      Ollama evaluation takes 10-30 seconds per job.
      With 50-100 jobs, total processing can exceed 30 minutes.
      HTTP webhooks typically have 30-60s timeout — the scraper would see a timeout error.
    decision: "n8n Webhook node responds 200 OK immediately before starting the processing chain"
    rationale:
      - "Scraper sender.ts has 15s timeout on the POST — would fail otherwise"
      - "Processing and delivery are separate concerns"
      - "Simpler error handling: scraper only cares about delivery, not evaluation"
    consequences:
      positive:
        - "Scraper never times out"
        - "Clean separation: delivery vs. evaluation"
      negative:
        - "No immediate feedback if Ollama or Notion fails"
        - "Errors visible only in n8n execution logs"
    implementation: "RespondToWebhook node placed BEFORE evaluation chain in n8n workflow"

  ADR-005:
    title: "GitHub Actions as scraper runtime (not local cron)"
    status: accepted
    date: "2024-07"
    context: >
      Scraper needs to run daily at a fixed time without user intervention.
      Running locally requires the machine to be on. A server adds cost.
    decision: "Use GitHub Actions free tier with scheduled workflow"
    rationale:
      - "Free for public repos, ~500 min/month for private (more than enough)"
      - "Zero infrastructure"
      - "Playwright works on ubuntu-latest runner"
      - "Easy secret management via GitHub Secrets"
    consequences:
      positive:
        - "Fully automated, machine-independent"
        - "Free"
        - "Built-in artifact storage for debug"
      negative:
        - "Runner has 15-min job timeout"
        - "n8n webhook must be publicly accessible (requires --tunnel)"
        - "No direct access to Ollama from runner (Ollama runs locally)"
    implementation: ".github/workflows/scraper.yml"

  ADR-006:
    title: "Local-first webhook delivery with optional public endpoint for CI"
    status: accepted
    date: "2026-05"
    context: >
      Public free tunnels (localtunnel/ngrok free) are unstable and can return
      503 Tunnel Unavailable. This breaks scraper delivery despite healthy local n8n.
      The project must stay максимально бесплатным and operational in local mode.
    decision: >
      Default WEBHOOK_URL to local n8n endpoint (http://localhost:5678/webhook/jobs/ingest).
      Use public tunnel/hosted endpoint only when GitHub Actions runner must reach n8n.
    rationale:
      - "Local mode is stable and free; no dependency on tunnel uptime"
      - "CI mode still possible with public endpoint when needed"
      - "Clear separation of operating modes reduces false incident debugging"
    consequences:
      positive:
        - "Reliable local runs"
        - "No tunnel costs for day-to-day usage"
        - "Faster failure triage (local service vs external transport)"
      negative:
        - "GitHub Actions mode requires explicit public URL management"
        - "Two operation modes must be documented and kept in sync"
    implementation: ".env, .env.example, scraper/src/config.ts, README.md"

  ADR-007:
    title: "Cursor-based incremental vacancy processing (POC)"
    status: proposed
    date: "2026-05"
    context: >
      Daily webhook runs currently can reprocess the same vacancies many times,
      causing unnecessary Ollama calls and slower pipelines.
      Precise schedule timing is not guaranteed, so fixed-window filtering is fragile.
    decision: >
      Introduce a persistent cursor (last_successful_run_at / high-watermark datetime)
      stored in Notion and process only vacancies newer than the cursor,
      with a small overlap window and deterministic deduplication.
    rationale:
      - "Cuts repeated LLM evaluations and reduces local compute load"
      - "Works with irregular run times (manual + daily)"
      - "Fits project constraints: Notion as the only persistent store"
    consequences:
      positive:
        - "Lower Ollama/API load"
        - "Faster daily runs"
        - "Clear audit trail of processed windows"
      negative:
        - "Need robust time normalization (UTC only)"
        - "Missing publishedAt in some sources needs fallback strategy"
        - "Concurrent runs require lock/idempotency guard"
    implementation: "POC backlog: context/roadmap.yaml -> POC-1"

  ADR-008:
    title: "Sequential Ollama evaluation with pre-LLM Notion dedup"
    status: accepted
    date: "2026-05"
    context: >
      Sender batches (25 items) caused multiple concurrent evaluate executions in n8n.
      Combined with parallel HTTP calls to local Ollama this led to timeouts
      (ECONNABORTED timeout of 120000ms) and partial batch processing.
      Also, duplicate URLs were evaluated by Ollama before dedup happened in Notify.
    decision: >
      In evaluate workflow, process items strictly sequentially via Split In Batches (batchSize: 1),
      perform Notion URL dedup before Ollama call, and increase Ollama HTTP timeout to 300000ms.
      In scraper config, raise default WEBHOOK_BATCH_SIZE to 250 to reduce parallel workflow executions.
    rationale:
      - "One-item processing avoids concurrent local Ollama overload"
      - "Pre-LLM dedup removes repeated expensive evaluations"
      - "Higher timeout tolerates model latency and local queueing"
      - "Larger webhook payload default reduces simultaneous subworkflow runs"
    consequences:
      positive:
        - "Stable per-item evaluation without fan-out spikes"
        - "Less wasted Ollama compute on already-known URLs"
        - "Lower probability of HTTP timeout in evaluate stage"
      negative:
        - "End-to-end evaluation latency per run is longer"
        - "More Notion read calls before LLM (rate limits must be monitored)"
        - "Notify still keeps dedup guard, resulting in duplicate protection at two layers"
    implementation: "n8n/workflows/evaluate.json, scraper/src/config.ts, context/modules/n8n.yaml"

  ADR-009:
    title: "Split In Batches relocated from evaluate to ingest; evaluate = pure single-item sub-workflow"
    status: accepted
    date: "2026-05"
    context: >
      evaluate.json contained Split In Batches (size 1) with a loopback architecture.
      ingest.json called evaluate via three parallel Switch outputs (justjoin/nofluffjobs/unknown),
      each creating a separate executeWorkflow execution with its own Split context.
      With one item per execution, Split's output[1] (Done) fired immediately after the first item,
      sending that item to NOOP:Done instead of the evaluation chain. Result: only 1 in N items
      was evaluated, the rest were silently dropped.
    decision: >
      Move Split In Batches (size 1) into ingest.json, placed after Code: Normalize Jobs and
      before Switch: Route by Source. evaluate.json becomes a pure single-item sub-workflow
      with no Split and no loopbacks. Switch is kept in ingest (after Split) for future
      per-source evaluate routing extensibility. waitForSubWorkflow: true on Call 'Evaluate'
      ensures ingest waits for each item before advancing the loop.
    rationale:
      - "Loopback Split pattern only works within a single execution — not across executeWorkflow calls"
      - "Placing Split in the caller (ingest) keeps the loop context stable across all items"
      - "evaluate as single-item sub-workflow is simpler, testable, and has no hidden state"
      - "Switch after Split preserves routing capability without creating parallel fan-out"
      - "waitForSubWorkflow: true prevents concurrent Ollama calls (VRAM pressure)"
    consequences:
      positive:
        - "All items reliably processed — NOOP:Done bug eliminated"
        - "evaluate is stateless and easy to test in isolation"
        - "Switch extensible: add LinkedIn → new output → new evaluate sub-workflow"
        - "Single dedup location (evaluate, pre-LLM) — no duplicate Notion API calls"
      negative:
        - "evaluate can no longer be called with a batch — must always receive 1 item"
        - "Loop management responsibility shifts to ingest (slightly more complex ingest)"
    implementation: >
      n8n/workflows/ingest.json (Split + Switch + loopback),
      n8n/workflows/evaluate.json (pure single-item, no Split),
      n8n/workflows/notify.json (simplified, dedup removed),
      context/modules/n8n.yaml (updated workflow descriptions)
    supersedes: "Part of ADR-008 (Split In Batches placement)"

  ADR-010:
    title: "Migrate n8n to Oracle Cloud Infrastructure Always Free"
    status: proposed
    date: "2026-05"
    context: >
      Current deployment requires developer's laptop running 24/7 with n8n + Ollama.
      Public tunnel (localtunnel/n8n --tunnel) is unstable: rotates URLs on restart,
      returns 503/504 intermittently. This is the #1 reliability risk — if laptop
      sleeps or tunnel crashes, GitHub Actions scraper silently fails.
      Oracle Cloud Always Free offers ARM A1 instances (4 vCPU, 24 GB RAM, 200 GB disk)
      at $0/month permanently (not a trial).
    decision: >
      Deploy n8n, Caddy (reverse proxy + auto-TLS), and PostgreSQL (n8n internal DB)
      as a Docker Compose stack on an OCI Ampere A1 Flex instance.
      Use free domain (DuckDNS or own) for stable HTTPS webhook URL.
    rationale:
      - "Eliminates tunnel dependency — WEBHOOK_URL set once, never rotates"
      - "24/7 uptime independent of developer's laptop"
      - "$0/month forever — OCI Always Free is not a trial"
      - "24 GB RAM handles n8n + Postgres + Caddy with room for future NestJS"
      - "PostgreSQL prevents SQLite 'database is locked' under concurrent writes"
    consequences:
      positive:
        - "Stable 24/7 operation without human intervention"
        - "No manual WEBHOOK_URL rotation after tunnel restart"
        - "Future-proof infra for NestJS + Lovable UI stage"
      negative:
        - "ARM (aarch64) — needs ARM-compatible Docker images (available for n8n/Caddy)"
        - "OCI A1 availability — high demand, may take days to provision"
        - "New infra to maintain: server updates, Docker updates, firewall"
        - "Oracle could change Always Free terms (low probability)"
    implementation: >
      Phase 7 (CLOUD-1 through CLOUD-12) in context/roadmap.yaml.
      ADR file: docs/adr/ADR-010-cloud-migration-oracle.md

  ADR-011:
    title: "Replace local Ollama with free Cloud LLM API (Groq/Gemini)"
    status: proposed
    date: "2026-05"
    supersedes_partially: "ADR-002 (Local Ollama constraint — now applies only to local dev mode)"
    context: >
      ADR-002 banned cloud LLMs for rate limits, costs, and privacy reasons.
      With ADR-010 (cloud migration to ARM), the situation reverses:
      Oracle ARM instances have NO GPU. Ollama on CPU: ~2-5 tok/s.
      200 vacancies would take 3-6 hours (vs 15 min with cloud API).
      CPU-bound inference consumes 100% of 4 vCPU, destabilizing n8n.
      Original ADR-002 concerns: (1) rate limits — solved by throttled queue;
      (2) costs — solved by free tiers (Groq 15 RPM, Gemini 15 RPM/1500 RPD);
      (3) privacy — job postings are public data, not PII.
    decision: >
      Use Groq (primary) and Gemini 1.5 Flash (fallback) free-tier APIs.
      Implement Throttled Queue: Wait node (4s) after each LLM call = ≤15 RPM.
      Keep Ollama as local dev/test option via LLM_PROVIDER env var.
    rationale:
      - "10-20x faster: 15 min vs 3-6 hours for 200 vacancies"
      - "$0 cost — both Groq and Gemini have sufficient free tiers"
      - "n8n CPU stays idle during evaluation — stable for concurrent operations"
      - "Higher model quality available (Gemini Flash, Llama 3 70B via Groq)"
      - "Dual-provider fallback increases reliability"
      - "Job postings are public data — no PII concern"
    consequences:
      positive:
        - "Fast evaluation (15 min for full daily batch)"
        - "No GPU/VRAM management needed"
        - "Dual-provider redundancy"
      negative:
        - "External API dependency (mitigated by fallback)"
        - "Rate limits require throttled queue pattern"
        - "Free tier terms may change (mitigated by dual-provider)"
        - "New API key secrets to manage"
    implementation: >
      Part of Phase 7 (CLOUD-9 through CLOUD-11).
      ADR file: docs/adr/ADR-011-cloud-llm-migration.md.
      Updates architect.md anti-pattern CLOUD_LLM → PAID_LLM.

  ADR-012:
    title: "Evaluator observability — Evaluation Log + Feedback Loop"
    status: proposed
    date: "2026-05"
    context: >
      Currently, rejected vacancies go to NoOp: Discard Non-Match — zero observability.
      ~180 of 200 daily vacancies are rejected, but there is no way to verify correctness.
      False negatives (wrongly rejected good vacancies) are invisible.
      Prompt tuning is guesswork without data on evaluator accuracy.
      ADR-011 (cloud LLM switch) makes this critical: model change may shift behavior
      and without a baseline, regression is undetectable.
    decision: >
      Implement 4-level incremental observability:
      Level 1 (immediate): Notion Evaluation Log DB — logs ALL decisions (match + reject).
      Level 2 (next sprint): Telegram inline feedback buttons + /rejected + /wrong commands.
      Level 3 (after 2 weeks data): Weekly accuracy report via cron workflow.
      Level 4 (NestJS stage): Dynamic profile tuning via Telegram commands.
    rationale:
      - "Can't improve what you can't measure — prompt tuning needs data"
      - "Model migration safety net — before/after comparison baseline"
      - "Notion already integrated — one extra node, not a new service"
      - "Level 1 alone provides 80% of value with minimal effort (1-2 hours)"
      - "Telegram inline buttons = 1-tap feedback, zero friction"
    consequences:
      positive:
        - "Full visibility into ALL evaluator decisions"
        - "Detect false negatives (missed good vacancies)"
        - "Data-driven prompt improvements"
        - "Regression detection on model changes"
      negative:
        - "Extra Notion API calls (+1 per vacancy for logging)"
        - "Notion storage growth (~6000 records/month, within free tier)"
        - "Manual review effort — Human Verdict must be marked by hand"
        - "Telegram callback_query handling adds workflow complexity"
    implementation: >
      Phase 8 (EVAL-1 through EVAL-12) in context/roadmap.yaml.
      ADR file: docs/adr/ADR-012-evaluator-observability.md.
      New Notion DB: Evaluation Log. New env var: NOTION_EVAL_LOG_DB_ID.

  ADR-013:
    title: "Promptfoo as lightweight prompt evaluation framework"
    status: accepted
    date: "2026-05"
    context: >
      Prompt tuning is currently manual and lacks regression guardrails.
      Model changes (ADR-011: Ollama → Groq/Gemini) may shift evaluation behavior
      undetected. Need automated accuracy measurement before and after prompt edits.
    decision: >
      Use Promptfoo with a gold dataset (20 curated test cases) + deterministic JS
      assertions for match field + optional llm-rubric via Gemini Flash for reason text.
      Integrate into GitHub Actions PR workflow for regression prevention.
    rationale:
      - "Zero infra — runs locally or in CI with one command"
      - "JS assertions are free and deterministic (no API calls)"
      - "Gold dataset serves as living spec for evaluator behavior"
      - "F1/precision/recall metrics enable data-driven prompt tuning"
    consequences:
      positive:
        - "Catch prompt regressions before deploy"
        - "Objective accuracy baseline for model migration"
        - "PR-gated prompt deploy via Telegram inline keyboard"
      negative:
        - "Gold dataset must be maintained as real vacancies change"
        - "Overfitting risk if dataset is too small"
    implementation: >
      n8n/prompts/promptfooconfig.yaml, n8n/prompts/gold_dataset.yaml.
      Phase 10 (P10-1…P10-13) in roadmap.yaml.

  ADR-014:
    title: "Telegram callback_query handling deferred to P7 (Cloud Migration)"
    status: accepted
    date: "2026-05"
    context: >
      EVAL-6 (Feedback Handler) requires a Telegram Trigger node in n8n to receive
      callback_query events (👍/👎 button presses). n8n's telegramTrigger node works
      exclusively via Telegram's setWebhook API, which requires:
        1. A publicly accessible HTTPS URL
        2. Only ONE webhook per bot token (Telegram API limitation)
      Current local setup: n8n on localhost:5678 + localtunnel tunnel.
      Problems encountered:
        - localtunnel subdomain instability causes setWebhook to fail with 400
        - N8N_WEBHOOK_URL env var doesn't reliably propagate to webhook registration
        - The main ingest/telegram-trigger workflow already occupies the single webhook slot
        - Activating a second telegramTrigger workflow for the same bot always fails
      Polling mode (additionalFields.mode: polling) exists in n8n docs but is not
      exposed in the UI for the installed n8n version — the node ignores the JSON param.
    decision: >
      Defer Telegram callback_query handling (EVAL-6, EVAL-7, EVAL-8) to P7.
      After Oracle Cloud migration (ADR-010), n8n will have a stable HTTPS URL
      (Caddy + Let's Encrypt), making setWebhook registration reliable.
      In the meantime:
        - feedback-handler.json Telegram Trigger node is REMOVED (only Notion Trigger kept)
        - telegram-trigger.json rebuilt to handle BOTH message and callback_query
          in ONE workflow — ready to import after P7
        - Human Verdict can still be set manually in Notion UI as a workaround
    rationale:
      - "Tunnel instability makes webhook registration non-deterministic"
      - "One webhook per bot is a hard Telegram API constraint — can't have two workflows"
      - "P7 (Oracle Cloud + Caddy) solves the root cause: stable HTTPS URL"
      - "Combined telegram-trigger.json is already prepared — P7 import is 5 minutes of work"
      - "Notion UI manual fallback covers the gap without data loss"
    consequences:
      positive:
        - "No more webhook registration failures blocking workflow activation"
        - "Combined workflow is cleaner architecture (one trigger, one bot slot)"
        - "P7 unblocks this along with all other tunnel-dependent issues"
      negative:
        - "👍/👎 buttons in Telegram are inactive until P7"
        - "Human Verdict must be set manually in Notion until P7"
        - "Feedback loop (EVAL-6…EVAL-8) delayed"
    workaround: >
      Manual: open Evaluation Log in Notion, find entry, set Human Verdict field directly.
      Notion Trigger in feedback-handler.json remains active — verdict routing
      (Wrong-Match → add to Board, Wrong-Reject → mark Rejected) still fires automatically
      when Human Verdict is changed in Notion, even without Telegram buttons.
    resolved_by: "P7 — CLOUD-8 (stable HTTPS) + CLOUD-10 (workflow import to cloud n8n)"
    implementation: >
      n8n/workflows/telegram-trigger.json — combined bot (message + callback_query),
        ready to import after P7. active: false until then.
      n8n/workflows/feedback-handler.json — Notion Trigger only, active now.
      Blocked tasks: EVAL-6, EVAL-7, EVAL-8 → status: blocked_until_p7.

  ADR-015:
    title: "Semantic fingerprint deduplication replacing URL-only Notion query"
    status: accepted
    date: "2026-05-27"
    context: >
      The original dedup check (Notion getAll node, filter URL equals $json.url) was broken
      in three independent ways:
        1. Wrong filter field name: `urlValue` is used for writing page properties; the filter
           condition for URL type requires the generic `value` field — Notion API received an
           empty string, always returning 0 results.
        2. Unreliable IF condition: `!!$json.id` — JobOffer has its own `id` field, so when
           Notion returned no results and `alwaysOutputData: true` passed through the input
           item, `$json.id` was truthy and the job was incorrectly treated as a duplicate.
        3. URL-only matching fails cross-platform: the same job posted on JustJoin AND
           NoFluffJobs has different URLs — dedup never fired.
    decision: >
      Replace the single Notion node dedup with a 3-level semantic deduplication system:
        Level 1 (Code: Dedup Batch): within-batch dedup by fingerprint + urlNorm using
          in-memory Sets — eliminates duplicates inside the same webhook payload before
          any Notion API calls.
        Level 2 (HTTP Request → Notion API): replace broken Notion node with direct
          POST /databases/query using OR filter: fingerprint | urlNorm | originalUrl.
          Backward-compatible: old records without Fingerprint still matched by URL.
        Level 3 (Code: Check Duplicate): parse Notion API response, set isDuplicate flag.
      Fingerprint = FNV1a64(normalizeCompany + "::" + normalizeTitle), 16 hex chars.
      Normalization: strip legal forms (Sp. z o.o., LLC, GmbH, Ltd, Corp, etc.),
        strip seniority prefixes (Senior, Junior, Lead, Principal, Staff, etc.),
        normalize common abbreviations (full-stack→fullstack, node.js→nodejs, etc.).
    rationale:
      - "Cross-platform: same job on JustJoin + NoFluffJobs → same fingerprint → one record"
      - "URL-invariant: job reposted with new URL / tracking params → same fingerprint"
      - "Direct Notion API call bypasses n8n node's filter parsing — no field name ambiguity"
      - "Backward compatible: OR filter includes URL conditions for pre-fingerprint records"
      - "FNV-1a 64-bit is sufficient (collision probability negligible at <10k records)"
    consequences:
      positive:
        - "Cross-platform and cross-run deduplication works reliably"
        - "No wasted Ollama compute on previously evaluated jobs"
        - "Fingerprint stored in Notion enables future similarity analytics"
        - "Pure JS — no external modules (n8n sandbox restricts require)"
      negative:
        - "Requires manual addition of Fingerprint (Text) property to Evaluation Log Notion DB"
        - "Old records have no fingerprint — URL fallback covers backward compat"
        - "Company/title normalization is heuristic — very unusual names may not match"
        - "require('crypto') disallowed in n8n Code node sandbox — SHA256 not available,
          FNV-1a used instead (not cryptographically secure, but sufficient for dedup)"
    implementation: >
      n8n/workflows/ingest.json:
        - Code: Normalize Jobs — added normalizeCompany(), normalizeTitle(), FNV1a64(),
          normalizeUrl(); outputs urlNorm, fingerprint, dedupFilter per job
        - Code: Dedup Batch — new node, within-batch dedup by fingerprint + urlNorm
        - Notion: Find Existing URL — replaced Notion node with httpRequest node,
          POST /databases/query, body: JSON.stringify($json.dedupFilter)
        - Code: Check Duplicate — new node, isDuplicate = results.length > 0
        - IF: Already in Notion? — condition: $json.isDuplicate === true (boolean, strict)
        - Code: Parse Ollama Response — added fingerprint: job.fingerprint || '' to return
        - Notion: Log to Eval Log — added Fingerprint|rich_text property write
      docs/notion-schema.md — Fingerprint field added, Dedup Strategy section rewritten
      context/modules/n8n.yaml — nodes_sequence + notion_field_mapping updated
      context/roadmap.yaml — P4-5/6/7 notes updated with full rework history
    manual_action_required: >
      Add property `Fingerprint` (type: Text) to the Evaluation Log Notion database.
      Without this, new records are created without fingerprint — dedup falls back to
      URL-only matching until the field is added.
    supersedes: "Part of ADR-008 (pre-LLM URL dedup) and ADR-003 (Notion dedup approach)"

  ADR-016:
    title: "LLM Provider Adapter Pattern — model-agnostic evaluation pipeline"
    status: accepted
    date: "2026-05-28"
    extends: "ADR-011 (formalizes and implements LLM_PROVIDER env vars)"
    context: >
      All model-specific code is hardcoded for Ollama in 5 places: URL, auth, request body
      format, structured output mechanism (format:{schema}), and response parse path
      (response.message.content). ADR-011 proposed LLM_PROVIDER/LLM_API_KEY/LLM_MODEL env
      vars but provided no adapter implementation. Switching to Gemini, Anthropic, or Bedrock
      requires simultaneous changes across n8n workflow JSON and promptfoo config.
      ADR-010 (Oracle Cloud) and ADR-011 (cloud LLM) make this urgent: Oracle ARM has no GPU.
    decision: >
      Extract all provider-specific logic into n8n/providers/ adapter modules:
        _interface.ts  — LLMRequest, LLMResponse, LLMProvider interface (the contract)
        ollama.ts      — OllamaAdapter: Ollama HTTP API + format:{schema} grammar
        gemini.ts      — GeminiAdapter: generateContent API + responseSchema
        anthropic.ts   — AnthropicAdapter: Messages API + output_config.format
        index.ts       — getProvider(name) factory, reads LLM_PROVIDER env var
      n8n: single LLM Router Code Node replaces hardcoded HTTP Request: Ask Ollama node.
      promptfoo: provider via LLM_PROVIDER env var; remove assistant prefill from
      evaluator-template.json (Ollama-specific, breaks Gemini/Anthropic).
      AWS Bedrock: deferred — requires IAM SigV4 auth + AWS SDK, separate ADR needed.
    rationale:
      - "One .env change switches provider for both n8n and promptfoo"
      - "Adding a new provider: create one file only (n8n/providers/new.ts)"
      - "Downstream pipeline unchanged — all nodes receive normalized {content, provider, model}"
      - "Formalizes ADR-011 env vars with actual routing implementation"
      - "PE techniques (ADR-017) require per-provider structured output hook"
    consequences:
      positive:
        - "LLM_PROVIDER=gemini LLM_API_KEY=xxx → n8n works without workflow JSON changes"
        - "Provider-specific bugs isolated to one file, not scattered across n8n nodes"
        - "npm run eval tests any provider without config changes"
      negative:
        - "n8n LLM Router Code Node larger than simple HTTP Request (mitigated: ~15 lines/adapter)"
        - "Loses assistant prefill — compensated by few-shot examples in P13 (ADR-017)"
        - "Bedrock deferred — needs follow-up ADR with AWS SDK decision"
    implementation: >
      Phase P12 tasks: P12-1 through P12-8 (see context/roadmap.yaml P12).
      New files: n8n/providers/_interface.ts, ollama.ts, gemini.ts, anthropic.ts, index.ts
      Updated: n8n/workflows/ingest.json, n8n/prompts/promptfooconfig.yaml,
               n8n/prompts/evaluator-template.json, .env.example
      New docs: docs/adr/ADR-016-llm-provider-adapter-pattern.md,
                docs/llm-provider-switching.md

  ADR-017:
    title: "Prompt Engineering Best Practices — structured output, few-shot, CoT, retry loop"
    status: in_progress # L1 complete (P13-1/2/3); L2–L6 pending
    date: "2026-05-28"
    depends_on: "ADR-016 (provider adapters implement per-provider structured output)"
    context: >
      Current evaluator has 4 systemic weaknesses:
        1. Structural: format:'json' is unreliable — per-provider schema enforcement needed
           (resolved by ADR-016 adapters).
        2. Logic contradictions pass CI: score=85 with red_flags:["Crypto industry"] is
           structurally valid but semantically wrong — no cross-field validation exists.
        3. Silent failures: parse error in n8n → job lost, no log, no retry.
        4. Zero-shot for edge cases: boundary jobs need examples to calibrate scoring.
      Anthropic prompt engineering docs recommend: structured output via schema enforcement,
      few-shot examples, chain-of-thought reasoning, validation + retry, multi-pass review.
    decision: >
      Apply 5-level PE maturity stack to evaluator:
        L1 — Structured Output: per-provider JSON Schema via ADR-016 adapters (no p() parser)
        L2 — Few-Shot: 3 curated examples in system prompt (hot match, force reject, edge case)
        L3 — Chain of Thought: <thinking> XML block before JSON output
        L4 — Retry Loop: n8n semantic validator Code Node + re-prompt with error context (max 2)
        L5 — Review Pass: Gemini Flash second call for borderline scores (50-79 only)
      Convergence criterion: F1 >= 0.90 on gold_dataset, 0 semantic violations.
    rationale:
      - "L1: guarantees schema-valid JSON — eliminates p() parser hack from all assertions"
      - "L2: few-shot calibrates edge cases without adding evaluation cost"
      - "L3: CoT forces explicit FORCE REJECT rule-checking before committing to score"
      - "L4: retry converts silent parse/semantic failures into self-correcting loop"
      - "L5: review limited to 50-79 range — minimizes Gemini API calls (free tier safe)"
    consequences:
      positive:
        - "Zero silent failures in n8n — all errors produce log entry or trigger retry"
        - "Edge case accuracy improves (few-shot + CoT show measurable lift in promptfoo)"
        - "FORCE REJECT semantic invariants enforced at runtime via retry loop"
      negative:
        - "System prompt grows ~500 tokens (few-shot) — acceptable latency tradeoff"
        - "CoT adds ~100 tokens/response — JSON extraction needs regex update in n8n"
        - "L5 review pass requires GOOGLE_API_KEY — free tier 15 RPM, sequential only"
    implementation: >
      Phase P13 tasks: P13-1 through P13-12 (see context/roadmap.yaml P13).
      L1 COMPLETE (2026-05-28):
        P13-1: passthrough.format:{JSON Schema} in promptfooconfig.yaml providers[0].config.
               Key finding: promptfoo requires passthrough.format: (NOT config.format:) to pass
               the field to Ollama API top-level; config.format: silently lands in options{} and
               is ignored — model falls back to free-form text with markdown fences.
        P13-2: 26 JS assertions refactored (4 defaultTest + 22 gold_dataset).
               p() helper removed everywhere. try { JSON.parse(output) } catch { return false }.
               Multiline YAML (|) required — promptfoo buildFunctionBody() prepends 'return'
               to single-line values, producing 'return try {}' SyntaxError.
        P13-3: JSON.parse(raw) in Code: Parse Ollama Response (ingest.json).
               Dual-format parser (lastIndexOf/indexOf/substring) removed.
      Pending: L2 (P13-4/5), L3 (P13-6/7), L4 (P13-8/9), L5 (P13-10), L6 (P13-11/12).
      Updated: n8n/prompts/promptfooconfig.yaml, n8n/prompts/gold_dataset.yaml,
               n8n/workflows/ingest.json
      Planned: n8n/prompts/evaluator.md (+few-shot P13-4), evaluator-template.json (+CoT P13-6),
               gold_dataset.yaml (+5 semantic cases P13-12), docs/prompt-engineering-sop.md (P13-11)

  ADR-018:
    title: "Manual Job URL Checker — Telegram /check command with LLM field extraction"
    status: proposed
    date: "2026-05-28"
    context: >
      The automated pipeline only covers JustJoin.it and NoFluffJobs.
      Corporate job sites (e.g. Scompler, Appify) are invisible to the scraper.
      The user must manually read these pages, copy data into Notion, and assess fit —
      a 20-40 minute task per vacancy.
      Existing infrastructure already supports this: source='manual' is defined in
      interfaces.yaml (JobOffer.source) and routed in ingest.json Switch node (route=2).
      telegram_trigger.json was planned in P5 but never implemented (status: not_created).
    decision: >
      Implement Telegram /check <url> trigger as a new n8n workflow (telegram-trigger.json).
      Flow: Telegram Trigger → HTTP fetch URL → strip HTML to plain text → LLM extract_job_fields
      prompt → POST to existing /webhook/jobs/ingest with source='manual' → existing pipeline
      handles dedup + evaluation + Notion creation. Bot replies with result summary.
      Safe fallbacks: SPA detection (charCount < 500), HTTP error handling, LLM JSON parse fallback.
    rationale:
      - "source='manual' already in interfaces.yaml and ingest.json Switch — zero backend changes"
      - "Reuses existing LLM evaluator, Notion write, Telegram alert — only new code is trigger + extraction"
      - "Two-step LLM approach: extract_job_fields (new) → existing evaluator — clean separation of concerns"
      - "HTTP fetch (no Playwright) is lean: corporate sites with SSR render correctly; SPA detected gracefully"
      - "After P12 (LLM Adapter), extraction prompt automatically supports Gemini — free future compatibility"
    consequences:
      positive:
        - "User submits corporate URL in Telegram → Notion page in <30 seconds, zero manual work"
        - "No new services, no new databases — stays at $0/month"
        - "Closes P5 planned-but-unimplemented gap (telegram_trigger.json)"
      negative:
        - "SPA/JS-only sites (CSR) return near-empty HTML — user must paste text manually as fallback"
        - "LLM extraction quality varies by page structure — tested on Scompler/Appify, not guaranteed universally"
        - "Adds second LLM call per manual job (extract + evaluate) — acceptable latency tradeoff"
    implementation: >
      Phase P14 tasks: P14-1 through P14-7 (see context/roadmap.yaml P14).
      New files: n8n/workflows/telegram-trigger.json, n8n/prompts/extract-job-fields.md,
                 n8n/prompts/extract-job-fields-template.json
      Updated: context/modules/n8n.yaml (telegram_trigger status → created, phase → P14)

  ADR-019:
    title: "Drop Playwright from the two automated scrapers — direct HTTP against the real APIs"
    status: accepted
    date: "2026-10-05"
    context: >
      ADR-001 (2024-07) adopted Playwright because direct HTTP to both job boards
      returned 403 under Cloudflare WAF. A throwaway CI workflow
      (.github/workflows/temp-cf-check.yml, branch experiment/cf-direct-http-check)
      re-tested this from a GitHub Actions runner: plain curl GETs to JustJoin's
      candidate-api and to the NoFluffJobs category page both returned 200 with real
      data, with or without a browser-like User-Agent. The Cloudflare block from 2024
      no longer reproduces for either endpoint.
      Separately, the nofluffjobs.ts comment claiming "page=N is cumulative SSR"
      (dated 2026-05) was found to be wrong when actually re-verified live, in both
      Playwright and plain HTTP: ?page=N echoes the page number back in the response's
      params but the embedded postings never change, and the true last page returns a
      null searchResponse. This made the production scraper return 0 jobs regardless of
      fetch method — a site-side contract change, not a consequence of this refactor.
      DevTools-style capture of the live site's own "Pokaż kolejne oferty" (load more)
      button revealed the real mechanism: it POSTs to /api/search/posting (the same
      endpoint ADR-001's predecessor used pre-2026-05) with
      Content-Type: application/infiniteSearch+json and a pageTo query param. That
      content type is load-bearing — application/json on the same request silently
      makes the server re-send the full first-page snapshot on every page instead of
      the next batch.
    decision: >
      scraper/src/scrapers/justjoin.ts and scraper/src/scrapers/nofluffjobs.ts now call
      their respective APIs directly via axios — no browser launch. justjoin.ts calls
      /api/candidate-api/offers (unchanged endpoint, just no XHR interception).
      nofluffjobs.ts POSTs /api/search/posting with pageTo=1..totalPages (capped at
      MAX_PAGES=20) and Content-Type: application/infiniteSearch+json; postings come
      from the top-level `postings` field or, when the site segments by its "Salary
      Match" feature, from `additionalSearch[0].postings`. A 300-500ms delay between
      paginated calls is kept — removing it was observed to make NFJ's server fall back
      to the full-snapshot behavior described above.
      scraper/src/utils/browser.ts and the `playwright` dependency are KEPT: they are
      still used by check-manual.ts (manual job submission from an arbitrary URL). This
      ADR only covers the two automated scrapers.
    rationale:
      - "Direct HTTP re-verified reachable from a GitHub Actions runner — no bypass needed"
      - "No browser launch = faster CI runs, no Playwright install step for these two scrapers"
      - "The /api/search/posting fix was found by capturing the site's own real request, not by guessing"
      - "check-manual.ts genuinely needs a real browser (arbitrary third-party job pages) — not touched"
    consequences:
      positive:
        - "nofluffjobs.ts goes from a silent 0-jobs production bug to ~104/108 (~96%) unique postings per run"
        - "justjoin.ts scraper no longer needs a browser context at all"
        - "CI can run these two scrapers without `npx playwright install`"
      negative:
        - "nofluffjobs.ts now depends on an undocumented, unversioned internal API
           (/api/search/posting) discovered via DevTools, not a stable public contract —
           same fragility class as the pre-2026-05 approach it reverts to"
        - "robots.txt disallows /api/ on nofluffjobs.com. This was already effectively
           being hit via Playwright XHR interception pre-2026-05, so it is not a new
           policy stance, but it's now a direct, named request path worth tracking if
           access is ever challenged"
        - "~4 of 108 postings are still not retrieved per run (totalPages caps at 6 batches
           of ~20; minor, acceptable loss, not investigated further)"
        - ".github/workflows/temp-cf-check.yml (and its branch) deleted — the reachability
           question it existed to answer is now closed"
    implementation: >
      Updated: scraper/src/scrapers/justjoin.ts, scraper/src/scrapers/nofluffjobs.ts,
               scraper/tests/nofluffjobs.unit.test.ts (extractSsrPostings tests replaced
               with extractPostingsBatch tests)
      Removed: .github/workflows/temp-cf-check.yml
      Unchanged: scraper/src/utils/browser.ts, scraper/src/check-manual.ts,
                 playwright dependency
      No changes to: ingest.json, interfaces.yaml, types.ts (source='manual' already present)

  ADR-020:
    title: "Global sources batch 1 — thehub, swissdevjobs, greenhouse, lever, ashby"
    status: accepted
    date: "2026-11-04"
    context: >
      The pipeline only searched Poland (JustJoin, NoFluffJobs). The candidate is an EU
      (Polish) citizen and wants global offers: Nordics, UK, CH, NL, EU remote, US remote
      via B2B. Research on 2026-11-04 (read-only GET checks) confirmed that these sources
      expose public, unauthenticated, machine-readable job data:
      TheHub (api.thehub.io/v2/jobs + /jobs/single/{id}, Nordic startups, has
      expirationDate), SwissDevJobs (job_feed.xml, salary almost always present),
      Greenhouse / Lever / Ashby public job-board APIs (official, per-company, full text).
      Median posting age was 5-92 days; sampled apply pages returned 200 with apply forms.
      robots.txt did not disallow the used paths (Ashby robots.txt returned Unauthorized).
      Rejected for now: LinkedIn (ToS forbids automation), TokyoDev / startup.jobs /
      EU-Startups (403 bot protection), JapanDev / Welcome to the Jungle (Algolia keys
      not public), Solid.jobs (no search API found), DevITJobs (mostly agencies — batch 2),
      Remotive / Himalayas (low volume / apply pages 403 — later).
    decision: >
      Extend JobOffer.source with 'thehub' | 'swissdevjobs' | 'greenhouse' | 'lever' |
      'ashby'. Add one scraper module per source family (thehub.ts, swissdevjobs.ts,
      ats.ts for the three ATS APIs driven by a curated company list in config.ts).
      All new scrapers share a pre-filter in scraper/src/utils/global-filter.ts:
      senior-level title, JS/TS stack signal, posting age <= 60 days, not expired, and
      no hard legal blocker (US citizen only, security clearance). Location is NOT
      pre-filtered: remote-anywhere and relocation offers go to the LLM, which applies
      the 2026-11 location rules. The pre-filter exists to protect free LLM quota.
      No other JobOffer / WebhookPayload / EvaluationResult field changes.
    rationale:
      - "Official or aggregator-intended public APIs/feeds — low ban and ToS risk"
      - "Covers the highest-priority regions (Nordics, CH, ATS for UK/NL/EU/US remote) first"
      - "Shared pre-filter keeps daily volume within free Gemini/n8n limits"
      - "The shared filter ignores optional-only JS/TS mentions and HTML attributes, and requires explicit JS/TS evidence for Java/C#/.NET primary roles"
    consequences:
      positive:
        - "First non-Polish sources; Nordic startups, Swiss roles with salary, curated ATS companies"
      negative:
        - "n8n Switch: Route by Source sends unknown sources to the fallback branch until
           it is extended (fallback still reaches Notion, but logs 'Unknown Source')"
        - "Notion Source select must get the 5 new options, otherwise page create may fail"
        - "Live evaluator must run the 2026-11 location/currency rules, otherwise foreign
           offers score 0 for 'Wrong location'"
        - "ATS coverage depends on a hand-maintained company slug list"
        - "TheHub needs one detail request per job (rate-limited with a delay)"
    implementation: >
      scraper/src/types.ts, scraper/src/config.ts, scraper/src/index.ts,
      scraper/src/utils/global-filter.ts, scraper/src/scrapers/{thehub,swissdevjobs,ats}.ts,
      unit tests in scraper/tests/, context/interfaces.yaml, context/modules/scraper.yaml,
      docs/notion-schema.md. Production n8n / Notion changes are separate, user-approved steps.
      Filter regressions found during live ATS review are covered: escaped HTML
      attributes no longer count as stack signals, natural-language "react
      appropriately" is not the React framework, and optional-only stack mentions
      do not qualify Java/C#/.NET primary-role postings.
      Final read-only smoke on 2026-11-04 made 45 public GET requests with no
      failures and returned 169 filter-qualified offers: Greenhouse 152, Lever
      1, Ashby 16; Workable, Recruitee and Personio returned 0. A previous run
      had one Lever/Swile timeout, which was isolated. Separate live relevance
      checks found software-engineering matches at Greenhouse boards (including
      MongoDB, Grafana Labs, Deliveroo and Cloudflare), Matillion on Lever, and
      Lovable on Ashby. Five boards that returned no postings were removed from
      the configured slug lists. These are pre-filter results, not downstream
      LLM matches.

  ADR-021:
    title: "Global sources batch 2 — adzuna (free tier), ATS/feed sources deferred"
    status: accepted
    date: "2026-11-04"
    context: >
      ADR-020 batch 1 left the ATS and SwissDevJobs modules as placeholders.
      Live checks on 2026-11-04 (read-only GET) found: Workable widget v1, Recruitee
      offers API, Personio XML feed, Arbeitnow, JobTech SE and RemoteOK return 200
      without credentials. NAV stilling-feed needs a rotating public bearer token.
      Teamtailor RSS works, but the list page has no JSON-LD (only detail pages do).
      Adzuna needs a free key; the free tier is 25 calls in total (Pending
      Activation), paid tier is GBP 8/month, and the project rule is no paid
      services by default.
      Rejected in this batch: SmartRecruiters (api.smartrecruiters.com/robots.txt
      has Disallow: / for all bots except LinkedInBot), Getro VC boards (robots.txt
      asks to contact api@getro.com; the data path is an undocumented Next.js route;
      several boards do not resolve). Consider/a16z: no public JSON endpoint found.
      Earlier research claims that NAV needs no key and that Teamtailor list pages
      carry JSON-LD were wrong and are corrected here.
    decision: >
      Add JobOffer.source 'adzuna' and scraper/src/scrapers/adzuna.ts. It calls
      /v1/api/jobs/{gb,de,nl,at,ch}/search/1 with what_and, max_days_old=14 and
      results_per_page=50, and runs the shared pre-filter. Keys come from
      ADZUNA_APP_ID / ADZUNA_APP_KEY in .env; without them the scraper returns [].
      Adzuna descriptions are ~500-char snippets, so the LLM sees the snippet only;
      the apply link is Adzuna's redirect_url. Free-tier budget: one run costs
      len(countries) calls, so the daily cron must stay under the remaining quota
      or the user must switch tiers (decision required, not made here).
      The ATS (Workable, Recruitee, Personio), SwissDevJobs, and API boards
      (Arbeitnow, JobTech SE, RemoteOK, Teamtailor detail, NAV) are NOT implemented
      in this ADR; each gets its own slice.
    rationale:
      - "Adzuna is the only remaining candidate that needs a key and is fast to use"
      - "Shared pre-filter keeps LLM quota bounded; live run: 52 of 198 kept"
      - "Missing keys degrade to [] instead of failing the whole pipeline"
    consequences:
      positive:
        - "UK, DE, NL, AT, CH coverage with salary data on many postings"
      negative:
        - "Free tier is 25 calls total; one run spends 5. A daily run exhausts it in days"
        - "Aggregator: many listings come from recruitment agencies"
        - "Snippet-only descriptions reduce LLM evaluation quality"
        - "Adzuna ToS: redirect links must be kept, not stripped"
    implementation: >
      scraper/src/scrapers/adzuna.ts, scraper/src/config.ts (global.adzuna),
      scraper/src/index.ts, scraper/src/types.ts, scraper/tests/adzuna.unit.test.ts.
      Live check 2026-11-04: 1 run over 5 countries, 198 listings, 52 kept.
      Local interface and schema documentation synced. Production Notion Source
      select and n8n source routing remain operator tasks.

  ADR-022:
    title: "Public ATS feeds — Workable, Recruitee, and Personio"
    status: accepted
    date: "2026-11-04"
    context: >
      ADR-021 deferred ATS sources to a separate implementation slice. Live
      read-only checks on 2026-11-04 confirmed populated public boards for
      Workable (grecotel: 84 jobs, eurobank: 3), Recruitee (channable: 12),
      and Personio (tado: 2, clark: 3). The tested APIs need no authentication.
      Several initially proposed slugs returned 404 or empty boards, so the
      implementation uses only the verified slugs. Workable's widget list
      lacks full descriptions; the scraper fetches v2 details only for titles
      that pass the cheap senior-level filter. Recruitee provides descriptions
      in its offers response. Personio publishes an XML feed with CDATA job
      description sections. ATS postings remain subject to the shared global
      pre-filter and downstream LLM location evaluation.
    decision: >
      Implement the Workable, Recruitee, and Personio families in
      scraper/src/scrapers/ats.ts, configured via config.global.atsFeeds.
      Extend JobOffer.source with 'workable' | 'recruitee' | 'personio'.
      Scraper failures are isolated per company slug; no credentials or
      external services are introduced. Do not include SmartRecruiters
      (robots.txt disallows all bots except LinkedInBot) or Getro (robots.txt
      requests API access by contacting Getro) in this decision.
      This updates the scraper and local schema documentation only. Production
      Notion Source select options and n8n routing remain a separate, explicit
      operator task and must be completed before enabling these sources in a
      production webhook run.
    rationale:
      - "Uses unauthenticated ATS endpoints and only slugs confirmed live"
      - "Per-family normalization and a shared pre-filter keep the JobOffer contract stable"
      - "Failure isolation prevents one company board from stopping other source families"
    consequences:
      positive:
        - "Adds direct EU employer coverage and full descriptions where available"
        - "No added dependency or API credential"
      negative:
        - "Company slugs are manually curated and can become stale"
        - "The live smoke run on the five configured boards produced 0 qualifying offers; expand and validate the company list before judging source value"
        - "Workable needs a detail request per senior-title candidate"
        - "Personio XML feeds and ATS APIs are public but not guaranteed stable"
        - "Production Notion schema and n8n source routing are not changed here"
    implementation: >
      scraper/src/scrapers/ats.ts, scraper/src/config.ts (global.atsFeeds),
      scraper/src/types.ts, scraper/src/index.ts, scraper/tests/ats.unit.test.ts,
      context/interfaces.yaml, context/modules/scraper.yaml, docs/notion-schema.md.
      Live verification: 2026-11-04; synthetic tests cover parsing, filtering,
      empty/malformed responses, and per-source failures. Live ATS smoke fetched
      public responses, but the current five boards yielded zero qualifying
      offers under the age/seniority/stack filters.

  ADR-023:
    title: "Application submission channels — Channel 1 (Email Apply) active and ATS web-forms (subsequent stages)"
    status: accepted
    date: "2026-11-10"
    context: >
      The recruiter system includes a Personalized Application Generator (scraper/src/generator/)
      that produces tailored, ATS-compliant PDF CVs, customized Cover Letters, and application packages.
      A structured multi-channel application strategy is required to define how generated applications
      are submitted to employers, maintaining strict isolation, zero unexpected network side-effects,
      and $0 cost. Multiple channels exist in the recruitment domain: direct email apply, ATS job board
      web forms (Greenhouse, Lever, Workable), and regional job portal quick-apply forms (JustJoin IT).
    decision: >
      Adopt a phased multi-channel application architecture:
      1. Channel 1 (Email Apply): Implemented as the first active channel. Assembles a complete
         offline/local application package (to, subject, body, and attached PDF CV path) encapsulated
         in an EmailPackage manifest. Tested and verified in dry-run mode without sending real emails.
      2. Channels 2+ (ATS Web Forms & Portal Quick-Apply): Scheduled as subsequent roadmap stages
         (Phase 16.4). These channels include automated Playwright form filling for Greenhouse,
         Lever, Workable, and JustJoin IT application modals.
      3. Safety & Cost Invariant: Application generation and dry-run packaging must remain 100% offline
         and local ($0 cost). No external outbound network requests (SMTP, Resend, or form submission)
         may occur during generation or dry-run testing.
    rationale:
      - "Email Apply requires zero browser interaction with third-party web forms and has minimal failure surface"
      - "Bundling to a structured manifest (email_package.json) enables inspection before sending"
      - "Scheduling complex ATS form fillers (Greenhouse/Lever/Workable/JustJoin) as subsequent roadmap stages
         prevents scope explosion while delivering immediate end-to-end value"
      - "Aligns with project constraint: $0/month cost and zero unsolicited network sends during tests"
    consequences:
      positive:
        - "Immediate end-to-end application package generation ready for review"
        - "Clean channel abstraction (EmailPackage metadata channel: 'email_apply') ready for polymorphic channel expansion"
        - "Full compliance with dry-run and integrity mode constraints"
      negative:
        - "ATS web forms still require manual submission until subsequent roadmap stages are implemented"
        - "Email extraction from JD requires fallback heuristic when vacancy text lacks explicit hr/apply email"
    implementation: >
      scraper/src/generator/email-package.ts, scraper/src/generator/types.ts,
      scraper/src/generator/cli.ts, output/applications/, context/roadmap.yaml (Phase 16),
      PROJECT.md, docs/architecture.md.

  ADR-024:
    title: "Company metadata extraction and alert company dossier block (HITL Slice 1)"
    status: accepted
    date: "2026-11-12"
    context: >
      Candidates reviewing job alerts need rapid context regarding hiring companies (scale,
      website, product, business model). JustJoin.it and NoFluffJobs API responses include
      company metadata (companySize, companyUrl) that was previously discarded. Vacancies
      lacking direct URLs or from other sources lacked a standardized fallback to search
      for the company. Alerts and LLM evaluation lacked structured company background.
    decision: >
      1. Extend JobOffer with optional companyMeta: CompanyMetadata (size, companyUrl,
         advertiserType, industry) in scraper/src/types.ts.
      2. Extract companySize (normalized to string size) and companyUrl in JustJoin and
         NoFluffJobs scrapers with safe optional handling.
      3. Implement Google search fallback generator (https://www.google.com/search?q=${companyName + ' software'})
         for offers lacking direct company websites.
      4. Extend LLM Evaluator specification and templates with company_dossier (1-2 Russian
         sentences: product, business model B2B/B2C, company scale) grounded strictly in JD
         if unknown without hallucinations.
      5. Fix Telegram alert template in context/ingest-workflow.yaml with block «🏢 О компании»
         displaying company_dossier and direct website or Google search fallback.
    rationale:
      - "Instant employer context in alerts eliminates manual company research"
      - "Zero API cost ($0 invariant preserved)"
      - "100% backward compatible: companyMeta is optional"
    consequences:
      positive:
        - "Immediate visibility into company profile, scale, and direct URL in Telegram alerts"
        - "Seamless fallback to Google search when direct company URL is absent"
      negative:
        - "Minor increase (~30-50 tokens) in LLM output per evaluated job"
    implementation: >
      scraper/src/types.ts, scraper/src/utils/company.ts, scraper/src/scrapers/justjoin.ts,
      scraper/src/scrapers/nofluffjobs.ts, n8n/prompts/evaluator.md,
      n8n/prompts/evaluator-template.json, n8n/evaluator/prompt-builder.ts,
      n8n/evaluator/scoring.ts, docs/adr/ADR-024-company-metadata-and-dossier.md,
      context/interfaces.yaml, context/ingest-workflow.yaml, context/modules/scraper.yaml,
      context/modules/n8n.yaml.

  ADR-025:
    title: "HITL Telegram Review Filter and Hot Match Promotion Flow (Slice 2)"
    status: accepted
    date: "2026-11-12"
    context: >
      Vacancies scoring 50-79 were previously saved to Notion without interactive screening in Telegram.
      Candidates need a rapid 1-tap review mechanism in Telegram Topic 3 («На ревью») to promote
      promising vacancies to Topic 2 («Горячий мэтч») or discard them to archive, updating Notion statuses in real time.
    decision: >
      Adopt compact callback protocol (<=64 bytes) using 32-char hex page IDs:
      prm:<page_id> (promote), dsc:<page_id> (discard), app:<page_id> (apply), rej:<page_id> (reject).
      Topic 3 receives review alert with [ 👍 Берём в Hot Match ], [ 👎 В архив ], [ 🔗 Вакансия ].
      Clicking 'prm' updates Notion Status to 'Hot Match', replaces Topic 3 markup with confirmation,
      and forwards the full job card to Topic 2 with [ 🚀 Подготовить отклик ].
      Clicking 'dsc' updates Notion Status to 'Rejected' and marks message as dismissed.
    consequences:
      positive:
        - "Immediate 1-tap triage in Telegram Topic 3 with real-time Notion status updates"
        - "Clean separation between Topic 3 (quick review) and Topic 2 (command post)"
        - "Guaranteed protocol compliance under Telegram 64-byte callback limit"
      negative:
        - "Requires n8n callback_query router to handle inline button events"
    implementation: >
      scraper/src/utils/telegram.ts, scraper/src/types.ts, scraper/tests/telegram-hitl.unit.test.ts,
      docs/adr/ADR-025-hitl-telegram-review-and-promote-flow.md, context/ingest-workflow.yaml,
      context/modules/n8n.yaml, scripts/patch-n8n-hitl-review.py.

  ADR-026:
    title: "Telegram In-Thread Application Delivery (HITL Slice 3)"
    status: accepted
    date: "2026-11-12"
    context: >
      Applying to approved vacancies requires manual file system searches for the latest CV PDF,
      writing personalized LinkedIn outreach pitches, drafting cover letters, and updating Notion to Applied.
      The candidate needs instant in-thread delivery in Telegram Topic 2 triggered by [ 🚀 Подготовить отклик ] (app:<page_id>).
    decision: >
      Implement zero-token deterministic in-thread delivery:
      1. LinkedIn pitch generator (scraper/src/generator/cover-letter.ts) strictly 60-80 words, no clichés.
      2. Fast base gold cv.pdf caching (<0.2s delivery) in scraper/src/generator/cv-renderer.ts.
      3. Application bundle service (scraper/src/generator/telegram-delivery.ts) generating Telegram sendDocument
         and copy-ready monospaced text for LinkedIn and Cover Letter, transitioning Notion Status to 'Applied'.
    consequences:
      positive:
        - "1-tap application asset delivery directly to Telegram thread"
        - "1-click copy-ready format for outreach message and cover letter"
        - "100% offline, deterministic, $0 paid API cost"
        - "Instant Notion Kanban sync to Applied"
      negative:
        - "Customized per-job CV modifications require background Chromium rendering if bullets change"
    implementation: >
      scraper/src/generator/cover-letter.ts, scraper/src/generator/cv-renderer.ts,
      scraper/src/generator/telegram-delivery.ts, scraper/src/generator/types.ts,
      scraper/tests/generator/telegram-delivery.unit.test.ts,
      docs/adr/ADR-026-telegram-hitl-application-delivery.md,
      context/ingest-workflow.yaml, context/modules/n8n.yaml.

  ADR-027:
    title: "Telegram Feedback Loop and Dynamic Rule Synthesis (HITL Slice 4)"
    status: accepted
    date: "2026-11-12"
    context: >
      Discarding or rejecting vacancies in Telegram previously lacked qualitative feedback.
      The candidate needs a 1-tap rejection reason menu in Telegram Topic 2, recording human verdicts
      into Notion Evaluation Log, capturing optional text reply comments, and synthesizing draft filter rules
      when 3+ rejections accumulate around the same employer or technology.
    decision: >
      Implement complete feedback loop:
      1. Reject reasons menu (scraper/src/utils/telegram.ts) with tags:
         [ 💸 Зарплата ] (rfb:sal:id), [ 🏢 Аутсорс ] (rfb:out:id), [ 💀 Легаси ] (rfb:leg:id),
         [ 📍 Локация ] (rfb:loc:id), [ 📉 Грейд ] (rfb:jun:id), [ ❌ Без причины ] (dsc:id).
      2. Record Human Verdict = 'Wrong – Should Reject' in Notion Evaluation Log.
      3. Pattern analysis engine (scraper/src/feedback/feedback-analyzer.ts) detects 3+ rejections,
         creates draft rules (Active: false) for Matching Criteria & Guardrails, and emits Telegram activation proposal.
    consequences:
      positive:
        - "Zero-friction 1-tap feedback capture in Telegram Topic 2"
        - "Automatic synthesis of draft guardrails in Notion"
        - "Safe draft state (Active: false) prevents accidental over-filtering until approved"
      negative:
        - "Requires callback_query routing for rfb:* events"
    implementation: >
      scraper/src/utils/telegram.ts, scraper/src/feedback/feedback-analyzer.ts,
      scraper/src/types.ts, scraper/tests/feedback-loop.unit.test.ts,
      docs/adr/ADR-027-telegram-feedback-loop-and-rule-synthesis.md,
      context/ingest-workflow.yaml, context/modules/n8n.yaml.

