version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dbnet
    ports:
      - "5432:5432" # доступ внутри VCN (security list/NSG контролирует доступ)

volumes:
  pgdata:

networks:
  dbnet:
